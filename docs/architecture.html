<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pm-jude · Architecture Map</title>
<style>
  :root{
    --paper:#f5f2ec; --ink:#211d18; --ink-soft:#6b6357; --hairline:#d9d2c4;
    --card:#fdfbf7; --card-edge:#e4ddd0; --accent:#b4430e;
    --chip-bg:#ece7dc; --shadow:0 1px 2px rgba(33,29,24,.06),0 8px 24px rgba(33,29,24,.07);
    --c-adapter:#295bb8; --c-core:#b4430e; --c-gateway:#0e7268; --c-eval:#976a08; --c-ext:#8a8274;
    --c-terminal:#8a8274; --c-active:#b4430e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#161310; --ink:#e9e2d4; --ink-soft:#968d7d; --hairline:#332d25;
      --card:#1f1b16; --card-edge:#383127; --accent:#e8703a;
      --chip-bg:#2a251e; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
      --c-adapter:#6f97e8; --c-core:#e8703a; --c-gateway:#3aa89a; --c-eval:#d1a12e; --c-ext:#7d7669;
      --c-terminal:#7d7669; --c-active:#e8703a;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light dark;word-break:keep-all;overflow-wrap:break-word}
  body{
    font:15px/1.55 "Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);min-height:100vh;
    background-image:repeating-linear-gradient(45deg,transparent 0 11px,rgba(128,110,80,.025) 11px 12px);
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  header{
    border-top:3px solid var(--ink);border-bottom:1px solid var(--hairline);
    padding:24px 32px 0;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;
  }
  .wordmark{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:25px;font-weight:600}
  .wordmark em{font-style:italic;color:var(--accent)}
  .src{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}
  .tabs{display:flex;gap:4px;margin-left:auto;align-self:flex-end}
  .tab{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.12em;
    background:none;border:1px solid var(--hairline);border-bottom:none;color:var(--ink-soft);
    padding:9px 18px 8px;cursor:pointer;
  }
  .tab.on{background:var(--card);color:var(--accent);border-color:var(--card-edge);font-weight:600}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:26px 32px 48px;align-items:start}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .toolbar .lbl{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  .pbtn{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.08em;
    background:none;border:1px solid var(--hairline);color:var(--ink-soft);padding:5px 12px;cursor:pointer;border-radius:2px;
  }
  .pbtn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .pbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── 시스템 맵 (HTML 카드 + SVG 엣지 오버레이) ─────────────── */
  #mapwrap{position:relative}
  #map-edges{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
  .medge{fill:none;stroke-width:1.7;opacity:0;transition:opacity .25s}
  .medge.on{opacity:1}
  .medge.all{opacity:.3}
  .medge.e-out{stroke:var(--c-gateway);marker-end:url(#m-out)}
  .medge.e-in{stroke:var(--c-adapter);marker-end:url(#m-in)}
  .medge.dashed{stroke-dasharray:5 4}
  .mlabel{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;fill:var(--ink);
    paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}

  .layer{margin-bottom:18px;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
  .layer-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--layer-accent)}
  .layer-head .dot{width:8px;height:8px;border-radius:50%;background:var(--layer-accent)}
  .layer-head h2{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  .layer-head .n{margin-left:auto;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--ink-soft)}
  .layer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .flow{
    text-align:center;color:var(--ink-soft);font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:11px;letter-spacing:.2em;padding:2px 0 14px;opacity:.7;
  }

  .comp{
    background:var(--card);border:1px solid var(--card-edge);border-left:3px solid var(--layer-accent);
    padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .15s cubic-bezier(.22,1,.36,1),opacity .2s,box-shadow .15s;
  }
  .comp:hover{transform:translateY(-2px)}
  .comp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .comp.sel{outline:2px solid var(--layer-accent);outline-offset:1px}
  .comp.dim{opacity:.28;filter:grayscale(.6)}
  .comp.rel{box-shadow:0 0 0 1px var(--layer-accent),var(--shadow)}
  .comp h3{font-size:13.5px;font-weight:600;line-height:1.35;margin-bottom:5px}
  .comp .meta{display:flex;flex-wrap:wrap;gap:4px}
  .chip{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px;letter-spacing:.05em;
    background:var(--chip-bg);color:var(--ink-soft);padding:2px 6px;border-radius:2px;
  }
  .chip.phase{color:var(--layer-accent,var(--accent))}

  .l-adapter{--layer-accent:var(--c-adapter)}
  .l-core{--layer-accent:var(--c-core)}
  .l-gateway{--layer-accent:var(--c-gateway)}
  .l-eval{--layer-accent:var(--c-eval)}
  .l-ext{--layer-accent:var(--c-ext)}

  aside{
    position:sticky;top:20px;background:var(--card);border:1px solid var(--card-edge);
    border-top:3px solid var(--accent);box-shadow:var(--shadow);padding:20px 22px 24px;
    animation:rise .4s cubic-bezier(.22,1,.36,1) both;
  }
  aside .kicker{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  aside h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:20px;font-weight:600;line-height:1.3;margin-bottom:12px}
  aside .desc{font-size:13.5px;color:var(--ink);margin-bottom:14px}
  aside .facts{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;border-block:1px solid var(--hairline);padding:10px 0;margin-bottom:12px}
  aside .facts dt{color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
  aside .empty{color:var(--ink-soft);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:2}
  .tlist{list-style:none;font-size:12.5px}
  .tlist li{padding:5px 0;border-bottom:1px dashed var(--hairline);cursor:pointer}
  .tlist li:hover{color:var(--accent)}
  .tlist .arrow{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .tlist .arrow.in{color:var(--c-adapter)}
  .tlist .arrow.out{color:var(--c-gateway)}
  .sect{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 4px}

  /* ── 상태 머신 (SVG 그래프) ─────────────────────────────── */
  .smwrap{overflow-x:auto;margin-bottom:18px}
  #sm-svg{display:block;min-width:1240px;width:100%;height:auto}
  .snodeG{cursor:pointer}
  .snodeG rect.body{fill:var(--card);stroke:var(--card-edge);transition:stroke .15s}
  .snodeG rect.ring{fill:none;stroke:var(--card-edge)}
  .snodeG rect.bar{fill:var(--c-active)}
  .snodeG.terminal rect.bar{fill:var(--c-terminal)}
  .snodeG text.nm{fill:var(--ink);font:600 13px "Avenir Next","Avenir","Segoe UI",system-ui,sans-serif}
  .snodeG.terminal text.nm{fill:var(--ink-soft)}
  .snodeG text.sub{fill:var(--ink-soft);font:10px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em}
  .snodeG:hover rect.body,.snodeG:focus-visible rect.body{stroke:var(--accent)}
  .snodeG:focus-visible{outline:none}
  .snodeG.sel rect.body{stroke:var(--accent);stroke-width:2}
  .snodeG.rel-in rect.body{stroke:var(--c-adapter);stroke-width:1.8;stroke-dasharray:5 3}
  .snodeG.rel-out rect.body{stroke:var(--c-gateway);stroke-width:1.8;stroke-dasharray:5 3}
  .snodeG.lit rect.body{stroke:var(--accent);stroke-width:2.2}
  .snodeG.lit rect.bar{fill:var(--accent)}
  .snodeG.dimmed,.edge.dimmed,.elabel.dimmed{opacity:.13}

  .edge{fill:none;stroke:var(--ink-soft);stroke-width:1.4;marker-end:url(#m-n);transition:opacity .2s}
  .edge.return{stroke-dasharray:6 4}
  .edge.alt{stroke-dasharray:2 4}
  .edge.e-in{stroke:var(--c-adapter);stroke-width:2;marker-end:url(#m-in)}
  .edge.e-out{stroke:var(--c-gateway);stroke-width:2;marker-end:url(#m-out)}
  .edge.lit{stroke:var(--accent);stroke-width:2.2;marker-end:url(#m-lit)}
  .ehit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
  .elabel{font:10.5px ui-monospace,"SF Mono",Menlo,monospace;fill:var(--ink-soft);
    paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none;transition:opacity .2s}
  .elabel.hl{fill:var(--ink)}
  .token{fill:var(--accent);stroke:var(--paper);stroke-width:2}

  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em;padding:4px 2px 14px}
  .legend .sw{display:inline-block;vertical-align:middle;width:26px;height:0;border-top:2px solid var(--ink-soft);margin-right:6px}
  .legend .sw.ret{border-top-style:dashed}
  .legend .sw.alt{border-top-style:dotted}
  .legend .sw.term{width:14px;height:12px;border:1px solid var(--ink-soft);border-top:1px solid var(--ink-soft);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--ink-soft)}

  .rules{
    background:var(--card);border:1px solid var(--card-edge);border-left:3px solid var(--accent);
    padding:14px 16px;box-shadow:var(--shadow);font-size:13px;
  }
  .rules h3{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .rules li{margin-left:18px;margin-bottom:4px}

  .dataerr{background:var(--card);border:1px solid var(--accent);padding:16px 20px;margin:24px 32px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wordmark">pm-jude <em>· architecture</em></div>
  <div class="src">PRD v1.4 §7 · 정본: ARCHITECTURE.md · 데이터: #arch-data</div>
  <nav class="tabs">
    <button class="tab on" data-view="map">시스템 맵</button>
    <button class="tab" data-view="sm">상태 머신</button>
  </nav>
</header>

<div class="layout">
  <main>
    <div id="view-map">
      <div class="toolbar">
        <span class="lbl">Phase</span>
        <button class="pbtn on" data-phase="all">전체</button>
        <button class="pbtn" data-phase="0">Phase 0</button>
        <button class="pbtn" data-phase="1">Phase 1</button>
        <button class="pbtn" data-phase="2">Phase 2</button>
        <span class="lbl" style="margin-left:14px">연결</span>
        <button class="pbtn" id="btn-alledges">전체 표시</button>
      </div>
      <div id="mapwrap">
        <div id="layers"></div>
        <svg id="map-edges" aria-hidden="true"></svg>
      </div>
    </div>
    <div id="view-sm" style="display:none">
      <div class="toolbar">
        <span class="lbl">시나리오 재생</span>
        <span id="sc-btns"></span>
        <button class="pbtn" id="btn-clear">지우기</button>
      </div>
      <div class="legend">
        <span><span class="sw"></span>전이</span>
        <span><span class="sw ret"></span>복귀 전이</span>
        <span><span class="sw alt"></span>에스컬레이션</span>
        <span><span class="sw term"></span>이중 테두리 = 종결 (회신 필수, 원칙 5)</span>
      </div>
      <div class="smwrap"><svg id="sm-svg" role="img" aria-label="요청 라이프사이클 상태 머신"></svg></div>
      <div class="rules"><h3>코드로 강제되는 하드 제약</h3><ul id="rules-ul"></ul></div>
    </div>
  </main>
  <aside id="panel"></aside>
</div>

<!--
━━ 머신 가독 영역 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
이 페이지의 모든 모델 정보(레이어·컴포넌트·호출 엣지·상태·전이·시나리오·하드 제약)는
아래 #arch-data JSON data island가 단일 소스다. 정본 문서는 ARCHITECTURE.md이며,
정본 개정 시 이 island를 함께 갱신한다.

에이전트는 이 data island만 편집한다 — 위 HTML/CSS/JS 셸은 렌더러이므로 건드리면
페이지가 렌더링되지 않는다 (issues/index.html과 동일한 규약).

편집 후 검증:
  node -e "const s=require('fs').readFileSync('docs/architecture.html','utf8');JSON.parse(s.match(/<script type=\"application\/json\" id=\"arch-data\">([\s\S]*?)<\/script>/)[1]);console.log('arch-data ok')"

스키마 요약:
  layers[]          {id, name, note}
  components[]      {id, layer, name, intro(0|1|2), desc, funcs[], extra}
  componentEdges[]  {from, to, label?, dashed?}          — 호출 관계 (ARCHITECTURE.md 시스템 구성도)
  states[]          {id, name, kind("진행"|"종결"), funcs[], desc, col, row}  — col/row는 그리드 좌표
  transitions[]     {id, from, to, label?, kind?("return"|"alt"), bow?, via?[[col,row]…], labelT?, ldx?, ldy?}
  scenarios[]       {id, name, edges[transition id…]}
  hardRules[]       string
새 상태·전이 추가 시 col/row·via를 생략하면 기본 배치·직선 라우팅으로 렌더된다.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
-->
<script type="application/json" id="arch-data">
{
  "layers": [
    { "id": "adapter", "name": "채널 어댑터", "note": "모든 어댑터는 동일한 코어 API만 호출" },
    { "id": "core", "name": "채널 비의존 코어", "note": "단계 전이는 상태 머신이 결정 (ADR-0001)" },
    { "id": "gateway", "name": "LLM 게이트웨이", "note": "외부는 백엔드 종류를 모름" },
    { "id": "eval", "name": "평가·개선 서브시스템", "note": "계측 없는 기능은 만들지 않음 (원칙 6)" },
    { "id": "ext", "name": "외부 시스템", "note": "" }
  ],
  "components": [
    { "id": "slack-a", "layer": "adapter", "name": "Slack 어댑터", "intro": 0,
      "desc": "멘션·DM·이모지 인테이크, 스레드 명확화, 버튼 게이트, DM 역보고. Bolt for TypeScript + Assistant 스레드. Phase 0 PoC와 Phase 1의 1차 표면.",
      "funcs": ["F1"], "extra": "스테이크홀더의 서식지가 Slack이므로 전달 순서 1순위 (§9)" },
    { "id": "web-a", "layer": "adapter", "name": "웹 어댑터", "intro": 1,
      "desc": "Phase 1은 매직링크 경량 뷰어(긴 문서 열람·게이트), Phase 2에 채팅 인테이크·대시보드·SSO로 완결 표면화. 채널 비의존 원칙의 완성.",
      "funcs": ["F1", "F9"], "extra": "" },
    { "id": "intake", "layer": "core", "name": "인테이크 API", "intro": 1,
      "desc": "채널 무관 수신, 통합 프로필·세션 생성, 3초 이내 확인 응답. 세션은 요청자 ≠ 실사용자와 N명 요청자를 표현.",
      "funcs": ["F1"], "extra": "" },
    { "id": "sm", "layer": "core", "name": "상태 머신", "intro": 1,
      "desc": "단계 전이 결정과 하드 제약 강제의 주체. 게이트 라우터(영역 담당 → 기본 승인자 → 대체자)와 SLA 스케줄러(리마인더 → 대체자 통보 → 자동 백로그)를 포함.",
      "funcs": ["F5"], "extra": "원칙 2·5의 구현 지점 (ADR-0001)" },
    { "id": "clarify", "layer": "core", "name": "명확화 엔진", "intro": 0,
      "desc": "표적 질문 생성(해석 발산 지점 공략), 2층 완결성 판정(룰 백스톱 + LLM 의미 판정), 슬롯 3상태와 승격 판정. 질문은 요청자 언어로 3~5개.",
      "funcs": ["F2b", "F2c", "F2e"], "extra": "Phase 0에서 프롬프트 v0 검증" },
    { "id": "search", "layer": "core", "name": "컨텍스트 검색기", "intro": 1,
      "desc": "질문 생성 전에 기존 이슈·과거 문서·종결 세션·거절 이력을 검색. 시스템 유일의 LLM 자율 툴콜 지점(도구·횟수 제한). 중복 후보 제시의 출처.",
      "funcs": ["F2a"], "extra": "거절 이력은 차단이 아니라 참고 정보로만 제시" },
    { "id": "docgen", "layer": "core", "name": "문서 생성기 + UI 분류기", "intro": 0,
      "desc": "requirements/tasks 생성(EARS·Given-When-Then), 슬롯 단위 요청자 확인, 원문 전사 첨부. 명확화 종료 시 UI 변화 여부를 분류해 목업 실행을 결정.",
      "funcs": ["F3"], "extra": "문서 단일 진실 원천 (ADR-0002)" },

<script>
'use strict';
/* 렌더러 — 데이터는 #arch-data island가 단일 소스 (위 주석 참조) */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SVGNS = 'http://www.w3.org/2000/svg';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let DATA;
try {
  DATA = JSON.parse($('#arch-data').textContent);
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    `<div class="dataerr">#arch-data JSON 파스 실패 — 보드가 렌더링되지 않습니다.\n${esc(e.message)}</div>`);
  throw e;
}
const { layers: LAYERS, components: COMPONENTS, componentEdges: CEDGES,
        states: STATES, transitions: TRANSITIONS, scenarios: SCENARIOS, hardRules: RULES } = DATA;

let phaseFilter = 'all', selComp = null, selState = null, showAllEdges = false;

/* ══ 시스템 맵 — HTML 카드 + SVG 엣지 오버레이 ═══════════════ */
function phaseChip(intro){ return intro === 0 ? 'Phase 0~' : intro === 1 ? 'Phase 1~' : 'Phase 2~'; }
const compById = id => COMPONENTS.find(c => c.id === id);

let firstRender = true;
function renderLayers(){
  const root = $('#layers');
  root.innerHTML = '';
  LAYERS.forEach((layer, li) => {
    const comps = COMPONENTS.filter(c => c.layer === layer.id);
    const sec = document.createElement('section');
    sec.className = 'layer l-' + layer.id;
    if (firstRender) sec.style.animationDelay = (li * 60) + 'ms';
    else sec.style.animation = 'none';
    sec.innerHTML = `<div class="layer-head"><span class="dot"></span><h2>${esc(layer.name)}</h2><span class="n">${comps.length}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'layer-grid';
    comps.forEach(c => {
      const el = document.createElement('article');
      const dimmed = phaseFilter !== 'all' && c.intro > Number(phaseFilter);
      const related = selComp && CEDGES.some(e =>
        (e.from === selComp && e.to === c.id) || (e.to === selComp && e.from === c.id));
      el.className = 'comp' + (dimmed ? ' dim' : '') + (selComp === c.id ? ' sel' : related ? ' rel' : '');
      el.dataset.comp = c.id;
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.innerHTML = `<h3>${esc(c.name)}</h3><div class="meta">${c.funcs.map(f => `<span class="chip">${esc(f)}</span>`).join('')}<span class="chip phase">${phaseChip(c.intro)}</span></div>`;
      const act = () => { selComp = selComp === c.id ? null : c.id; renderLayers(); selComp ? showComp(c) : showIntro('map'); };
      el.onclick = act;
      el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } };
      grid.appendChild(el);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
    if (li < LAYERS.length - 1) root.insertAdjacentHTML('beforeend', '<div class="flow">▼</div>');
  });
  firstRender = false;
  requestAnimationFrame(drawMapEdges);
}

function cardRect(id){
  const el = document.querySelector(`[data-comp="${id}"]`);
  if (!el) return null;
  const w = $('#mapwrap').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - w.left, y: r.top - w.top, w: r.width, h: r.height,
           cx: r.left - w.left + r.width / 2, cy: r.top - w.top + r.height / 2 };
}

function mapEdgePath(a, b){
  let sx, sy, ex, ey;
  if (b.y >= a.y + a.h - 4){ sx = a.cx; sy = a.y + a.h; ex = b.cx; ey = b.y; }
  else if (a.y >= b.y + b.h - 4){ sx = a.cx; sy = a.y; ex = b.cx; ey = b.y + b.h; }
  else if (b.cx > a.cx){ sx = a.x + a.w; sy = a.cy; ex = b.x; ey = b.cy; }
  else { sx = a.x; sy = a.cy; ex = b.x + b.w; ey = b.cy; }
  const vert = Math.abs(ey - sy) >= Math.abs(ex - sx);
  const c1 = vert ? [sx, sy + (ey - sy) * .32] : [sx + (ex - sx) * .32, sy];
  const c2 = vert ? [ex, ey - (ey - sy) * .32] : [ex - (ex - sx) * .32, ey];
  return { d: `M${sx},${sy} C${c1},${c2},${ex},${ey}`, mx: (sx + ex) / 2, my: (sy + ey) / 2 };
}

function drawMapEdges(){
  const svg = $('#map-edges');
  const wrap = $('#mapwrap');
  svg.setAttribute('width', wrap.clientWidth);
  svg.setAttribute('height', wrap.clientHeight);
  svg.innerHTML = `<defs>
    <marker id="m-in" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--c-adapter)"/></marker>
    <marker id="m-out" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--c-gateway)"/></marker>
  </defs>`;
  CEDGES.forEach(e => {
    const on = showAllEdges || (selComp && (e.from === selComp || e.to === selComp));
    if (!on) return;
    const a = cardRect(e.from), b = cardRect(e.to);
    if (!a || !b) return;
    const { d, mx, my } = mapEdgePath(a, b);
    const p = document.createElementNS(SVGNS, 'path');
    const dir = (selComp && e.to === selComp) ? 'e-in' : 'e-out';
    p.setAttribute('d', d);
    p.setAttribute('class', `medge on ${dir}${e.dashed ? ' dashed' : ''}${showAllEdges && !selComp ? ' all' : ''}`);
    svg.appendChild(p);
    if (e.label && (selComp || showAllEdges)){
      const t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', mx); t.setAttribute('y', my - 5);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'mlabel');
      t.textContent = e.label;
      svg.appendChild(t);
    }
  });
}

function showComp(c){
  const layer = LAYERS.find(l => l.id === c.layer);
  const ins  = CEDGES.filter(e => e.to === c.id);
  const outs = CEDGES.filter(e => e.from === c.id);
  const row = (e, dir) => {
    const other = compById(dir === 'in' ? e.from : e.to);
    return `<li data-goto="${other.id}"><span class="arrow ${dir}">${dir === 'in' ? '←' : '→'}</span> ${esc(other.name)}${e.label ? ` <span style="color:var(--ink-soft)">· ${esc(e.label)}</span>` : ''}</li>`;
  };
  $('#panel').innerHTML = `
    <div class="kicker">${esc(layer.name)}</div>
    <h2>${esc(c.name)}</h2>
    <p class="desc">${esc(c.desc)}</p>
    <dl class="facts">
      <dt>기능</dt><dd>${c.funcs.length ? c.funcs.map(esc).join(' · ') : '—'}</dd>
      <dt>도입</dt><dd>${phaseChip(c.intro)}</dd>
      ${layer.note ? `<dt>레이어</dt><dd>${esc(layer.note)}</dd>` : ''}
    </dl>
    ${c.extra ? `<p class="desc" style="color:var(--ink-soft);font-size:12.5px">${esc(c.extra)}</p>` : ''}
    ${ins.length ? `<div class="sect">호출받음 (파랑)</div><ul class="tlist">${ins.map(e => row(e, 'in')).join('')}</ul>` : ''}
    ${outs.length ? `<div class="sect">호출함 (초록)</div><ul class="tlist">${outs.map(e => row(e, 'out')).join('')}</ul>` : ''}`;
  $('#panel').querySelectorAll('[data-goto]').forEach(li => {
    li.onclick = () => { selComp = li.dataset.goto; renderLayers(); showComp(compById(selComp)); };
  });
}

/* ══ 상태 머신 — SVG 그래프 ═══════════════════════════════ */
const CW = 205, RH = 150, NW = 176, NH = 60, OX = 24, OY = 110;
const cx = col => OX + col * CW + NW / 2;
const cy = row => OY + row * RH;
const stateById = id => STATES.find(s => s.id === id);
const transById = id => TRANSITIONS.find(t => t.id === id);
const edgeEls = {};   // transition id → {path, label}
const nodeEls = {};   // state id → g

function anchor(s, tx, ty){
  const x = cx(s.col), y = cy(s.row);
  const dx = tx - x, dy = ty - y;
  if (Math.abs(dx) / NW > Math.abs(dy) / (NH * 1.5))
    return { x: x + Math.sign(dx) * NW / 2, y, side: 'h' };
  return { x, y: y + Math.sign(dy) * NH / 2, side: 'v' };
}

function chainPath(points){
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 1; i < points.length; i++){
    const p = points[i - 1], q = points[i];
    const hx = (q.x - p.x) * .5;
    d += ` C${p.x + hx},${p.y} ${q.x - hx},${q.y} ${q.x},${q.y}`;
  }
  return d;
}

function transPath(t){
  const A = stateById(t.from), B = stateById(t.to);
  if (t.via){
    const vias = t.via.map(([c, r]) => ({ x: cx(c), y: cy(r) }));
    const a = anchor(A, vias[0].x, vias[0].y);
    const b = anchor(B, vias[vias.length - 1].x, vias[vias.length - 1].y);
    return chainPath([a, ...vias, b]);
  }
  const a = anchor(A, cx(B.col), cy(B.row));
  const b = anchor(B, cx(A.col), cy(A.row));
  const bow = (t.bow || 0) * RH;
  const dx = b.x - a.x, dy = b.y - a.y;
  if (Math.abs(dx) >= Math.abs(dy)){
    return `M${a.x},${a.y} C${a.x + dx * .35},${a.y + bow} ${b.x - dx * .35},${b.y + bow} ${b.x},${b.y}`;
  }
  return `M${a.x},${a.y} C${a.x + bow},${a.y + dy * .35} ${b.x + bow},${b.y - dy * .35} ${b.x},${b.y}`;
}

function renderSM(){
  const svg = $('#sm-svg');
  const maxCol = Math.max(...STATES.map(s => s.col));
  const maxRow = Math.max(...STATES.map(s => s.row));
  const W = OX * 2 + maxCol * CW + NW, H = OY + maxRow * RH + NH / 2 + 30;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs>
    <marker id="m-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--ink-soft)"/></marker>
    <marker id="m-in" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--c-adapter)"/></marker>
    <marker id="m-out" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--c-gateway)"/></marker>
    <marker id="m-lit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" style="fill:var(--accent)"/></marker>
  </defs>`;
  const gEdges = document.createElementNS(SVGNS, 'g');
  const gLabels = document.createElementNS(SVGNS, 'g');
  const gNodes = document.createElementNS(SVGNS, 'g');
  svg.append(gEdges, gLabels, gNodes);

  TRANSITIONS.forEach(t => {
    const d = transPath(t);
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'edge' + (t.kind ? ' ' + t.kind : ''));
    p.dataset.t = t.id;
    gEdges.appendChild(p);
    const hit = document.createElementNS(SVGNS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'ehit');
    hit.onclick = () => showTrans(t);
    gEdges.appendChild(hit);
    let label = null;
    if (t.label){
      const len = p.getTotalLength();
      const pt = p.getPointAtLength(len * (t.labelT ?? 0.5));
      label = document.createElementNS(SVGNS, 'text');
      label.setAttribute('x', pt.x + (t.ldx || 0));
      label.setAttribute('y', pt.y + (t.ldy ?? -6));
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('class', 'elabel');
      label.textContent = t.label;
      gLabels.appendChild(label);
    }
    edgeEls[t.id] = { path: p, label };
  });

  STATES.forEach(s => {
    const g = document.createElementNS(SVGNS, 'g');
    const x = cx(s.col) - NW / 2, y = cy(s.row) - NH / 2;
    g.setAttribute('class', 'snodeG' + (s.kind === '종결' ? ' terminal' : ''));
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.innerHTML =
      `<rect class="body" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="3"/>` +
      (s.kind === '종결' ? `<rect class="ring" x="${x + 3.5}" y="${y + 3.5}" width="${NW - 7}" height="${NH - 7}" rx="2"/>` : '') +
      `<rect class="bar" x="${x}" y="${y}" width="3" height="${NH}"/>` +
      `<text class="nm" x="${x + 13}" y="${y + 25}">${esc(s.name)}</text>` +
      `<text class="sub" x="${x + 13}" y="${y + 43}">${esc(s.kind)}${s.funcs.length ? ' · ' + s.funcs.join('·') : ''}</text>`;
    const act = () => { selState = s.id; applySMHighlight(); showState(s); };
    g.onclick = act;
    g.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } };
    gNodes.appendChild(g);
    nodeEls[s.id] = g;
  });
}

function applySMHighlight(){
  const relIn  = selState ? TRANSITIONS.filter(t => t.to === selState) : [];
  const relOut = selState ? TRANSITIONS.filter(t => t.from === selState) : [];
  STATES.forEach(s => {
    const g = nodeEls[s.id];
    g.classList.remove('sel', 'rel-in', 'rel-out', 'lit', 'dimmed');
    if (!selState) return;
    if (s.id === selState) g.classList.add('sel');
    else if (relIn.some(t => t.from === s.id)) g.classList.add('rel-in');
    else if (relOut.some(t => t.to === s.id)) g.classList.add('rel-out');
    else g.classList.add('dimmed');
  });
  TRANSITIONS.forEach(t => {
    const { path, label } = edgeEls[t.id];
    path.classList.remove('e-in', 'e-out', 'lit', 'dimmed');
    if (label) label.classList.remove('hl', 'dimmed');
    if (!selState) return;
    if (t.to === selState){ path.classList.add('e-in'); label && label.classList.add('hl'); }
    else if (t.from === selState){ path.classList.add('e-out'); label && label.classList.add('hl'); }
    else { path.classList.add('dimmed'); label && label.classList.add('dimmed'); }
  });
}

function showState(s){
  const inbound  = TRANSITIONS.filter(t => t.to === s.id);
  const outbound = TRANSITIONS.filter(t => t.from === s.id);
  const row = (t, dir) => {
    const other = stateById(dir === 'in' ? t.from : t.to);
    return `<li data-goto="${other.id}"><span class="arrow ${dir}">${dir === 'in' ? '←' : '→'}</span> ${esc(other.name)}${t.label ? ` <span style="color:var(--ink-soft)">· ${esc(t.label)}</span>` : ''}</li>`;
  };
  $('#panel').innerHTML = `
    <div class="kicker">${esc(s.kind)} 상태${s.kind === '종결' ? ' · 회신 필수 (원칙 5)' : ''}</div>
    <h2>${esc(s.name)}</h2>
    <p class="desc">${esc(s.desc)}</p>
    <dl class="facts"><dt>기능</dt><dd>${s.funcs.length ? s.funcs.map(esc).join(' · ') : '—'}</dd></dl>
    ${inbound.length ? `<div class="sect">들어오는 전이 (파랑)</div><ul class="tlist">${inbound.map(t => row(t, 'in')).join('')}</ul>` : ''}
    ${outbound.length ? `<div class="sect">나가는 전이 (초록)</div><ul class="tlist">${outbound.map(t => row(t, 'out')).join('')}</ul>` : ''}`;
  $('#panel').querySelectorAll('[data-goto]').forEach(li => {
    li.onclick = () => {
      const target = stateById(li.dataset.goto);
      selState = target.id; applySMHighlight(); showState(target);
    };
  });
}

function showTrans(t){
  const A = stateById(t.from), B = stateById(t.to);
  selState = null; applySMHighlight();
  edgeEls[t.id].path.classList.add('lit');
  $('#panel').innerHTML = `
    <div class="kicker">전이${t.kind === 'return' ? ' · 복귀' : t.kind === 'alt' ? ' · 에스컬레이션' : ''}</div>
    <h2>${esc(A.name)} → ${esc(B.name)}</h2>
    <p class="desc">${t.label ? esc(t.label) : '조건 없는 순차 전이.'}</p>
    <ul class="tlist">
      <li data-goto="${A.id}"><span class="arrow in">←</span> ${esc(A.name)}</li>
      <li data-goto="${B.id}"><span class="arrow out">→</span> ${esc(B.name)}</li>
    </ul>`;
  $('#panel').querySelectorAll('[data-goto]').forEach(li => {
    li.onclick = () => { const s = stateById(li.dataset.goto); selState = s.id; applySMHighlight(); showState(s); };
  });
}

/* ── 시나리오 재생 ── */
let playToken = null, playRun = 0;

function clearPlay(){
  playRun++;
  if (playToken){ playToken.remove(); playToken = null; }
  selState = null;
  applySMHighlight();
  document.querySelectorAll('#sc-btns .pbtn').forEach(b => b.classList.remove('on'));
  showIntro('sm');
}

function playScenario(sc, btn){
  clearPlay();
  btn.classList.add('on');
  const run = ++playRun;
  const ids = sc.edges;
  STATES.forEach(s => nodeEls[s.id].classList.add('dimmed'));
  TRANSITIONS.forEach(t => {
    edgeEls[t.id].path.classList.add('dimmed');
    edgeEls[t.id].label && edgeEls[t.id].label.classList.add('dimmed');
  });
  const litNode = id => { nodeEls[id].classList.remove('dimmed'); nodeEls[id].classList.add('lit'); };
  const litEdge = t => {
    const e = edgeEls[t.id];
    e.path.classList.remove('dimmed'); e.path.classList.add('lit');
    if (e.label){ e.label.classList.remove('dimmed'); e.label.classList.add('hl'); }
  };
  if (REDUCED){
    ids.forEach(id => { const t = transById(id); litNode(t.from); litEdge(t); litNode(t.to); });
    showScenarioPanel(sc);
    return;
  }
  const svg = $('#sm-svg');
  playToken = document.createElementNS(SVGNS, 'circle');
  playToken.setAttribute('r', 6);
  playToken.setAttribute('class', 'token');
  svg.appendChild(playToken);
  let i = 0;
  const step = () => {
    if (run !== playRun) return;
    if (i >= ids.length){ playToken && playToken.remove(); playToken = null; showScenarioPanel(sc); return; }
    const t = transById(ids[i]);
    litNode(t.from); litEdge(t);
    const path = edgeEls[t.id].path;
    const len = path.getTotalLength();
    const dur = Math.max(420, len * 1.6);
    const t0 = performance.now();
    const tick = now => {
      if (run !== playRun) return;
      const k = Math.min(1, (now - t0) / dur);
      const pt = path.getPointAtLength(len * k);
      playToken.setAttribute('cx', pt.x); playToken.setAttribute('cy', pt.y);
      if (k < 1) requestAnimationFrame(tick);
      else { litNode(t.to); i++; setTimeout(step, 140); }
    };
    requestAnimationFrame(tick);
  };
  step();
  showScenarioPanel(sc);
}

function showScenarioPanel(sc){
  const seq = sc.edges.map(id => transById(id));
  const names = [stateById(seq[0].from).name, ...seq.map(t => stateById(t.to).name)];
  $('#panel').innerHTML = `
    <div class="kicker">시나리오</div>
    <h2>${esc(sc.name)}</h2>
    <p class="desc">${names.map(esc).join(' → ')}</p>
    <ul class="tlist">${seq.map(t => t.label
      ? `<li><span class="arrow out">→</span> ${esc(stateById(t.to).name)} <span style="color:var(--ink-soft)">· ${esc(t.label)}</span></li>`
      : `<li><span class="arrow out">→</span> ${esc(stateById(t.to).name)}</li>`).join('')}</ul>
    <p class="empty" style="margin-top:12px">지우기 버튼 → 강조 해제</p>`;
}

/* ══ 공통 ═══════════════════════════════════════════════ */

  $('#panel').innerHTML = view === 'map'
    ? `<div class="kicker">시스템 맵</div><h2>컴포넌트 조감</h2>
       <p class="empty">컴포넌트 클릭 → 책임 · 호출 관계 강조<br>
       파란 선 = 이 컴포넌트를 호출<br>
       초록 선 = 이 컴포넌트가 호출<br>
       「전체 표시」 → 호출 그래프 전체<br>
       Phase 버튼 → 해당 시점 활성 컴포넌트<br><br>
       상세 정본: ARCHITECTURE.md</p>`
    : `<div class="kicker">상태 머신</div><h2>요청 라이프사이클</h2>
       <p class="empty">상태 클릭 → 설명 + 전이 강조<br>
       전이 선 클릭 → 전이 조건<br>
       시나리오 버튼 → 요청 경로 재생<br><br>
       전이 결정 주체: 코드 상태 머신 (ADR-0001)<br>
       이중 테두리 = 종결 · 회신 필수</p>`;
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  const v = t.dataset.view;
  $('#view-map').style.display = v === 'map' ? '' : 'none';
  $('#view-sm').style.display  = v === 'sm'  ? '' : 'none';
  showIntro(v);
  if (v === 'map') requestAnimationFrame(drawMapEdges);
});
document.querySelectorAll('.pbtn[data-phase]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.pbtn[data-phase]').forEach(x => x.classList.toggle('on', x === b));
  phaseFilter = b.dataset.phase;
  renderLayers();
});
$('#btn-alledges').onclick = () => {
  showAllEdges = !showAllEdges;
  $('#btn-alledges').classList.toggle('on', showAllEdges);
  drawMapEdges();
};
$('#btn-clear').onclick = clearPlay;

SCENARIOS.forEach(sc => {
  const b = document.createElement('button');
  b.className = 'pbtn';
  b.textContent = sc.name;
  b.onclick = () => playScenario(sc, b);
  $('#sc-btns').appendChild(b);
});
$('#rules-ul').innerHTML = RULES.map(r => `<li>${esc(r)}</li>`).join('');

new ResizeObserver(() => drawMapEdges()).observe($('#layers'));

renderLayers();
renderSM();
showIntro('map');
</script>
