name: CI

on:
  pull_request:

# 같은 PR에 push가 이어지면 진행 중이던 run을 취소한다(최신 commit만 검사).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node (format + lint + typecheck + vitest)
    # release-please가 만드는 릴리스 PR은 버전 범프·CHANGELOG뿐이므로 CI를 건너뛴다
    # (이미 CI를 통과한 커밋들의 집계다). skipped 잡은 required check도 충족한다.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager 필드로 pnpm 버전을 고정한다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      # web-ui 워크스페이스 멤버 (ADR-0008) — 자체 도구 체인으로 검사한다
      - name: Web UI typecheck
        run: pnpm --dir web-ui typecheck

      - name: Web UI ESLint
        run: pnpm --dir web-ui lint

      - name: Web UI Vitest
        run: pnpm --dir web-ui test

      - name: Web UI build
        run: pnpm --dir web-ui build
