<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pm-jude · Issue Ledger</title>
<style>
  /* shadcn neutral 토큰 — 정본: web-ui/app/globals.css (#37). 테마 토글이 없는
     self-contained 페이지이므로 .dark 클래스 대신 prefers-color-scheme으로 분기한다. */
  :root{
    --background:oklch(1 0 0); --foreground:oklch(0.145 0 0);
    --card:oklch(1 0 0); --card-foreground:oklch(0.145 0 0);
    --primary:oklch(0.205 0 0); --primary-foreground:oklch(0.985 0 0);
    --secondary:oklch(0.97 0 0); --secondary-foreground:oklch(0.205 0 0);
    --muted:oklch(0.97 0 0); --muted-foreground:oklch(0.556 0 0);
    --destructive:oklch(0.577 0.245 27.325);
    --border:oklch(0.922 0 0); --input:oklch(0.922 0 0); --ring:oklch(0.708 0 0);
    --radius:0.625rem;
    --shadow-xs:0 1px 2px 0 rgb(0 0 0/.05);
    --shadow-md:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);
    --shadow-lg:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);
    --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --c-none:var(--muted-foreground); --c-triage:#ea580c; --c-info:#d97706;
    --c-agent:#059669; --c-human:#2563eb; --c-closed:var(--muted-foreground);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0);
      --card:oklch(0.205 0 0); --card-foreground:oklch(0.985 0 0);
      --primary:oklch(0.922 0 0); --primary-foreground:oklch(0.205 0 0);
      --secondary:oklch(0.269 0 0); --secondary-foreground:oklch(0.985 0 0);
      --muted:oklch(0.269 0 0); --muted-foreground:oklch(0.708 0 0);
      --destructive:oklch(0.704 0.191 22.216);
      --border:oklch(1 0 0/10%); --input:oklch(1 0 0/15%); --ring:oklch(0.556 0 0);
      --c-triage:#fb923c; --c-info:#fbbf24; --c-agent:#34d399; --c-human:#60a5fa;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light dark}
  body{
    font:14px/1.55 var(--font-sans);
    background:var(--background); color:var(--foreground); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--font-mono)}

  header{
    border-bottom:1px solid var(--border);
    padding:16px 24px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center;
  }
  .wordmark{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .wordmark em{font-style:normal;font-weight:400;color:var(--muted-foreground)}
  .stats{font-size:12.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
  .stats b{color:var(--foreground);font-weight:500}
  .spacer{flex:1}
  #q{
    font:13px/1.4 var(--font-sans);
    height:36px;padding:0 12px;width:min(300px,60vw);
    background:transparent;border:1px solid var(--input);border-radius:var(--radius);
    color:var(--foreground);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  #q::placeholder{color:var(--muted-foreground)}
  #q:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}

  #error{
    display:none;margin:16px 24px;padding:12px 16px;border-radius:var(--radius);
    border:1px solid color-mix(in oklab,var(--destructive) 40%,transparent);
    background:color-mix(in oklab,var(--destructive) 8%,transparent);
    color:var(--destructive);font-family:var(--font-mono);font-size:12.5px;white-space:pre-wrap;
  }

  #board{display:flex;gap:16px;padding:20px 24px 48px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 70px)}
  .col{
    flex:0 0 288px;padding:8px;border-radius:calc(var(--radius) + 4px);
    background:color-mix(in oklab,var(--muted) 55%,transparent);
    animation:rise .5s cubic-bezier(.22,1,.36,1) both;
  }
  .col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
  .col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--col-accent)}
  .col-head h2{font-size:12.5px;font-weight:500}
  .col-head .n{margin-left:auto;font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
  .col.c-none  {--col-accent:var(--c-none)}
  .col.c-triage{--col-accent:var(--c-triage)}
  .col.c-info  {--col-accent:var(--c-info)}
  .col.c-agent {--col-accent:var(--c-agent)}
  .col.c-human {--col-accent:var(--c-human)}
  .col.c-closed{--col-accent:var(--c-closed)}

  .card{
    background:var(--card);color:var(--card-foreground);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-xs);
    transition:box-shadow .15s;
    animation:rise .45s cubic-bezier(.22,1,.36,1) both;
  }
  .card:hover{box-shadow:var(--shadow-md)}
  .card .cid{font-family:var(--font-mono);font-size:11px;color:var(--col-accent)}
  .card h3{font-size:13.5px;font-weight:500;line-height:1.45;margin:4px 0 8px}
  .card.closed h3{color:var(--muted-foreground);text-decoration:line-through;text-decoration-thickness:1px}
  .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;
    font-size:11px;font-weight:500;
    background:var(--secondary);color:var(--secondary-foreground);border:1px solid transparent;
  }
  .chip.blocked{
    background:color-mix(in oklab,var(--destructive) 10%,transparent);
    color:var(--destructive);border:1px dashed color-mix(in oklab,var(--destructive) 40%,transparent);
  }
  .empty-col{font-size:12px;color:var(--muted-foreground);padding:4px 6px}

  #void{
    display:none;text-align:center;padding:90px 32px;color:var(--muted-foreground);
    font-size:13px;line-height:2;
  }
  #void .big{font-size:20px;font-weight:600;color:var(--foreground)}

  #overlay{
    display:none;position:fixed;inset:0;background:rgb(0 0 0/.5);
    z-index:10;padding:6vh 20px;overflow-y:auto;
  }
  #overlay.on{display:block}
  #panel{
    max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-lg);
    padding:24px;animation:rise .3s cubic-bezier(.22,1,.36,1) both;
  }
  #panel .cid{font-family:var(--font-mono);font-size:12px;color:var(--panel-accent,var(--muted-foreground))}
  #panel h2{font-size:18px;font-weight:600;line-height:1.35;margin:4px 0 16px}
  .facts{
    display:grid;grid-template-columns:max-content 1fr;gap:6px 20px;font-size:12.5px;
    border-block:1px solid var(--border);padding:12px 0;margin-bottom:16px;
  }
  .facts dt{color:var(--muted-foreground)}
  .facts dd{color:var(--foreground)}
  .body-md{font-size:13.5px;line-height:1.6}
  .body-md h1,.body-md h2,.body-md h3{margin:18px 0 8px;line-height:1.35;font-weight:600}
  .body-md h1{font-size:16px}.body-md h2{font-size:14.5px}.body-md h3{font-size:13.5px}
  .body-md p{margin:0 0 10px}
  .body-md ul,.body-md ol{margin:0 0 10px 22px}
  .body-md li{margin-bottom:3px}
  .body-md code{font-family:var(--font-mono);font-size:.9em;background:var(--muted);padding:2px 5px;border-radius:6px}
  .body-md pre{background:var(--muted);padding:12px 14px;border-radius:var(--radius);overflow-x:auto;margin:0 0 12px}
  .body-md pre code{background:none;padding:0;border-radius:0}
  .body-md a{color:var(--foreground);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in oklab,var(--foreground) 30%,transparent)}
  .body-md a:hover{text-decoration-color:var(--foreground)}
  .comments{margin-top:24px;border-top:1px solid var(--border);padding-top:4px}
  .comment{border-bottom:1px solid var(--border);padding:14px 0}
  .comment:last-child{border-bottom:none}
  .comment .who{font-size:11.5px;font-weight:500;color:var(--muted-foreground);margin-bottom:6px}
  #close{
    float:right;font:12px/1 var(--font-sans);font-weight:500;height:32px;padding:0 12px;
    background:var(--background);border:1px solid var(--border);border-radius:var(--radius);
    color:var(--foreground);cursor:pointer;transition:background .15s;
  }
  #close:hover{background:var(--muted)}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    "id": 16,
    "title": "웹 우선 검증 전환 — 코어 러너 승격 + 웹 어댑터 (Slack·외부 API 후순위)",
    "state": "closed",
    "labels": [
      "ready-for-agent"
    ],
    "type": "task",
    "assignee": "claude",
    "parent": null,
    "blockedBy": [],
    "created": "2026-07-26",
    "updated": "2026-07-26",
    "body": "## Problem Statement\n\nPhase 0 갈래 A의 검증 표면이 Slack에 걸려 있으나, Slack 워크스페이스 설정과 외부 API 접근이 운영자 의존이라 착수가 막혀 있다(#8 ready-for-human, #10·#11 착수 불가 판정). 프롬프트 품질·파이프라인 검증이라는 PoC의 본래 목적이 외부 연동 일정에 블로킹되어 있다.\n\n## Solution\n\n전달 순서를 변경한다: 헤드리스 하네스(Claude Agent SDK, `claude -p`)와 로컬 웹 표면으로 인테이크 → 명확화 루프 → 2층 완결성 판정 → requirements 문서 생성 파이프라인을 먼저 완성·검증하고, Slack 어댑터와 외부 API 사용(Slack·Linear, 직접 API 전환)은 후순위로 미룬다. 파이프라인 로직은 채널 비의존 코어 러너로 승격하고(원칙 1), 웹 어댑터는 SlackPort와 대칭인 얇은 포트로 얹는다.\n\n## User Stories\n\n1. 요청자로서, Slack 계정·로그인 없이 웹 채팅 입력으로 요청을 제출하고 싶다. 그래야 지금 즉시 파이프라인을 쓸 수 있다.\n2. 요청자로서, 접수 즉시 확인 회신과 요청 ID를 받고 싶다. 그래야 요청이 접수됐음을 안다(침묵 방지).\n3. 요청자로서, 내 언어로 된 표적 질문을 한 번에 3~5개 받고 싶다. 그래야 부담 없이 답할 수 있다.\n4. 요청자로서, 각 질문에 예시 선택지를 보고 싶다. 그래야 비즈니스 어휘로 빠르게 답할 수 있다.\n5. 요청자로서, 모든 질문에서 「모르겠다 / 개발팀이 정할 문제다」를 1클릭으로 표시하고 싶다. 그래야 답할 수 없는 질문 앞에서 요청이 멈추지 않는다(US-10).\n6. 요청자로서, 답변을 반복하며 완결성 도달 시 명확화가 자동 종료되기를 원한다. 그래야 불필요한 왕복이 없다.\n7. 요청자로서, 왕복 상한에 도달하면 남은 슬롯이 승격되거나 보류(정보 부족)로 정리되기를 원한다. 그래야 세션이 방치되지 않는다.\n8. 요청자로서, 브라우저를 닫아도 세션이 영속되어 이어서 진행하고 싶다. 그래야 비동기로 답할 수 있다.\n9. 요청자로서, 완성된 requirements 문서를 웹에서 열람하고 싶다. 그래야 결과를 확인할 수 있다.\n10. 개발자로서, requirements 문서에 EARS·Given-When-Then 수용기준과 오픈이슈(승격 슬롯 + 담당자) 필드가 있기를 원한다. 그래야 곧바로 구현에 착수할 수 있다.\n11. 운영자로서, 원문 전사가 상시 보존되어 세션과 함께 조회되기를 원한다. 그래야 번역 무결성을 검증할 수 있다(원칙 7).\n12. 운영자로서, 모든 웹 세션이 프롬프트/모델/임계치/슬롯 스키마 버전에 귀속되기를 원한다. 그래야 개선 루프의 입력이 된다(F11).\n13. 운영자로서, 세션 익명화 export(골든셋 시드)가 웹 세션에도 동일하게 동작하기를 원한다. 그래야 골든셋 큐레이션이 끊기지 않는다.\n14. 운영자로서, Slack·Linear 설정 없이 파이프라인 전체를 로컬에서 기동하고 싶다. 그래야 외부 의존 없이 검증을 진행한다.\n15. 운영자로서, Slack 후순위 전환이 보드와 계획 문서에 기록되기를 원한다. 그래야 진행 순서에 혼선이 없다.\n16. 개발팀으로서, 파이프라인 로직이 채널 비의존 코어에 있기를 원한다. 그래야 Slack 복귀 시 어댑터 배선만 남는다(원칙 1).\n17. 운영자로서, 중단·전환 기준 (a) 정제 품질 판정에 필요한 세션 데이터가 웹 PoC에서 수집되기를 원한다. 그래야 #11 리포트 판정이 가능하다.\n\n## Implementation Decisions\n\n- **전달 순서 변경을 새 ADR로 기록**(append-only): PRD §9 「Slack 우선 전달」의 근거(채택 가설 우선 검증)를 뒤집는 결정이므로 트레이드오프 — 채택 신호(완주율·재사용률)는 Slack 복귀 전까지 미검증 — 를 명시한다. PRD §9 본문 개정은 별도 지시.\n- **코어 러너 승격**: slack-runner에만 있는 다회차 명확화 루프·2층 완결성 판정·승격/보류 분기·requirements 조립을 채널 비의존 코어 러너로 옮긴다. 코어가 회신 게시용 채널 포트(SlackPort와 대칭)를 정의하고 웹·CLI·Slack이 각자 구현한다. slack-runner는 얇은 어댑터로 축소하되 코드는 유지한다(후순위).\n- **웹 어댑터**: Node 내장 http 기반 로컬 단일 프로세스 서버. 웹 프레임워크 선택은 ARCHITECTURE.md 결정 대기 항목이므로 PoC에서 선점하지 않는다. 간이 식별(이름·언어 입력)로 SSO·매직 링크를 대체한다.\n- **게이트웨이 불변**: AgentSdkBackend(헤드리스 하네스, ADR-0005) 유지. 직접 API 전환(F14 Exit)은 연기한다.\n- **외부 API 봉인**: @slack/bolt 경로·Linear 연동은 제거하지 않고 후순위로 남긴다. 문서 전달의 종착은 웹 열람 + 기존 익명화 export.\n- **버전 귀속 유지**: 기존 버전 축 동기화와 임시 필수 슬롯 체계를 그대로 쓰고, #10 슬롯 초안 합류 시 슬롯 스키마 버전을 올려 교체한다(F2e).\n- **계획 문서 갱신**: phase0-plan.md 갈래 A를 웹 우선으로 개정하고 #8에 후순위 코멘트를 남긴다.\n\n## Testing Decisions\n\n- 좋은 테스트 = 외부 행위만 단언: 발화 시퀀스 입력 → 저장된 세션 상태·슬롯 3상태·산출 requirements 문서·회신 텍스트. 프롬프트 문자열·내부 호출 순서 같은 구현 세부는 단언하지 않는다.\n- **주 심(기존 재사용)**: 코어 러너 함수 × ScriptedBackend(LlmBackend 페이크) × SessionStore(임시 SQLite). Prior art: local-runner.test.ts, slack-runner.test.ts.\n- **웹 어댑터**: HTTP 계약 스모크 테스트 1~2개(기동 → 인테이크 POST → 세션 조회 GET). Prior art: smoke.test.ts.\n- 회귀 방어: slack-runner 테스트의 분기 케이스(승격/보류, 왕복 상한, 언어 감지)를 코어 러너 심으로 이관해 직교적으로 재구성한다.\n\n## Out of Scope\n\nSlack 어댑터 확장·운영(#8은 후순위로 유지), Linear API 일체(issueCreate·웹훅), 직접 API 전환(F14 Exit), 승인 게이트(F5), 목업(F4), 대시보드(F9), 관리 설정(F10), SSO·매직 링크, PRD §9 본문 개정(ADR 추가만), 소급 아카이브 분석 갈래(#9~#11의 운영자 경로).\n\n## Further Notes\n\n- 심·범위는 운영자 확인 완료: 기존 러너 심 재사용, 파이프라인 범위는 requirements 문서 생성까지(게이트 제외).\n- 중단·전환 기준 (b) 마찰 과다는 웹 완주율로 부분 판정 가능하나, 채택 가설 자체는 스테이크홀더의 서식지(Slack) 복귀 후 재검증이 필요하다 — ADR에 이 한계를 남긴다.",

    "body": "운영자 지시 (2026-07-27): 설계 vNext(#34)의 미구현 갭 3건을 구현한다 — docs/ux/requester-journey.md §7의 G-9·G-10·G-11.\n\n## G-9 상한 도달 시 승격 판정 (F2c ①②③, #28 S-1)\n현행은 미정제+상한이면 곧장 보류라, 승격 가능한데 미충족으로 남은 슬롯을 버린다. 남은 미충족 슬롯의 승격 가능 여부를 판정해 가능하면 오픈이슈로 올리고 조건부 문서로, 불가하면 보류로 분기한다.\n\n## G-10 오류·경합 계약 (#28 S-3·S-4)\n- 멱등 재시도: 재시도가 발화를 다시 적거나 라운드 예산을 먹지 않고, 죽은 단계(질문 생성 / 판정)만 다시 돌린다\n- 라운드 정합: 답변 제출이 응답 대상 라운드 식별자를 동반하고, 스테일 제출은 거부한다\n\n## G-11 문서 vN·종착 기록 (#28 S-2·S-5·S-6)\n- 정정 재생성 문서에 vN 표시 (정본 ERD requirements_doc vN·역주입 F4의 전제)\n- 전 슬롯 확인 완료를 세션에 기록 (#11 완주율의 분자)\n- 전면 승격 문서의 정직한 구분 표시\n\n## 범위 밖\nG-8(chrome 다국어 — 이연), O-1 보존 기간·O-2 폭주 상한 수치(운영자 결정 대기).",

    "body": "## 배경\n\n운영자 지시 (2026-07-28): 인테이크에 요청자가 정제하거나 컨텍스트를 담은 자료를 올릴 수단이 없다. 다양한 타입의 자료 업로드를 처리하는 기능을 계획하고, 현재 워크플로우·상태 관리와의 융합을 검토한다. 그릴링으로 결정 14건 확정.\n\n## 확정된 설계 (그릴링 2026-07-28)\n\n| # | 결정 | 내용 |\n|---|---|---|\n| 1 | 역할 | 명확화 입력 — 추출 텍스트가 질문 생성·완결성 판정에 실리고 슬롯을 채운다 |\n| 2 | 시점 | 「첨부는 요청자 발화에 붙는다」 — 인테이크·답변·재개·슬롯 정정 전부 |\n| 3 | 보존 | 원본은 sha256 주소로 불변, 추출 텍스트는 재생성 가능한 캐시 |\n| 4 | 버전 귀속 | 5축 유지. 추출기 버전은 attachment 행 + 신호 payload |\n| 5 | 추출 경로 | 텍스트 단일 경로. 이미지는 attachment-extraction 프롬프트로 서술 텍스트화 |\n| 6 | 타입 | MIME→추출기 레지스트리. Phase 0 등록은 텍스트류·이미지·OOXML·PDF, 미지원은 명시적 거부 |\n| 7 | 폭주 방지 | 세션당 추출 텍스트 총량 상한, 초과분은 업로드 시점 거부 |\n| 8 | 근거 추적 | slot_state.evidence_attachment_id 신설 + 확인 카드에 출처 표시 |\n| 9 | 타이밍 | 검증은 동기(즉시 거부), 추출은 라운드 백그라운드의 첫 단계. 실패는 고지 후 진행 |\n| 10 | 전송 | POST /api/uploads 스테이징 → uploadIds 참조. 미참조분 TTL 정리 |\n| 11 | 문서 지위 | 원문 전사와 동형 — 확정 사항은 문서 문장으로 흡수, 첨부는 참고용 목록 |\n| 12 | 프롬프트 | clarification·completeness·requirements 개정 + attachment-extraction 신설 |\n| 13 | 서빙 | Content-Disposition: attachment + nosniff 강제, 세션 스코프. SVG 제외 |\n| 14 | 산출 | ADR-0011 + 정본 개정 + 구현 티켓 (별도 설계 문서·wayfinder 맵 없음) |\n\n## 상태 관리 융합 (검토 결과)\n\n새 세션 상태·새 전이가 없다. 추출은 상태가 아니라 라운드 백그라운드 작업의 한 단계이므로 inFlight(세션당 1개)·SSE 수명 규칙·G-10 재시도 CTA를 그대로 쓴다. 첨부는 발화에 붙으므로 라운드 정합(roundId) 계약과 왕복 상한 산입 규칙이 변하지 않는다. 슬롯 3상태·완주 판정(recordCompletion)·버전 귀속 5축 무변경. 확장이 필요한 곳은 IntakeEvent(채널 무관 첨부 참조)와 buildConversation(발화별 첨부 조립) 둘뿐이다.\n\n## 이 티켓의 범위\n\n정본 개정만. 코드 변경 없음.\n\n- **ADR-0011** 신설 — 첨부의 아키텍처 결정 고정: 명확화 입력으로서의 지위, 텍스트 단일 경로(게이트웨이 계약·Exit 기준 보존), 원본 불변/추출 파생, 버전 귀속 5축 유지\n- **PRD** — F1(인테이크에 자료 첨부와 수용기준), F2c(첨부 근거 슬롯 판정), F3(첨부 유래 확정 사항의 문서 흡수, 출처 표시)\n- **CONTEXT.md** — 용어 2건 신설: 첨부 자료(Attachment), 추출(Extraction). 양 언어 정의 + _Avoid_ 목록\n- **docs/data-model.md** — attachment 엔티티, slot_state.evidence_attachment_id, 결정 대기 항목 3건(파일당 크기·세션 총량·개수 상한)\n- **ARCHITECTURE.md** — ERD에 attachment 추가. mermaid 수정 후 `node scripts/check-arch-sync.mjs --write`\n- **docs/ux/requester-journey.md** — 인테이크 폼·마법사     "body": "## 문제\n웹은 documented 세션의 일반 답변을 409로 막고 슬롯 확인·정정으로 안내한다(src/web/server.ts:412-418). 그러나 코어 processReply는 closed만 검사하고(src/runner/core-runner.ts:531) slack-runner의 handleThreadReply는 상태 검사 없이 core.handleReply를 호출한다(src/runner/slack-runner.ts:73-75). 결과: 문서 게시 후 Slack 스레드의 아무 답글이나 전 슬롯 재판정을 돌리고, 정제 판정이면 correction:false로 문서 vN+1이 게시되며 왕복 상한까지 소비한다. Slack에는 슬롯 확인·정정 경로 자체가 없어 요청자가 의도한 정정과 잡담을 구분할 수단도 없다.\n\n## 수용기준\n- documented 상태의 일반 답변 처리 규칙이 채널 무관하게 코어 한 곳에서 강제된다 (웹 409와 동등한 안내 회신)\n- 스레드 답글로 인한 의도치 않은 재판정·버전 증가·왕복 상한 소비가 발생하지 않는다\n- 테스트로 고정 (documented 세션 스레드 답글 시나리오)\n- Slack용 슬롯 확인·정정 UX는 범위 외 — 별도 이슈로 분리\n\n## 참조\nsrc/web/server.ts:412-418(웹 가드), tests/slack-runner.test.ts",

    "id": 54,
    "title": "목업 반복·디자인 시스템 선정 — UI 기획 확정 루프 (F4)",
    "state": "open",
    "labels": [
      "ready-for-agent"
    ],
    "type": "task",
    "assignee": "claude",
    "parent": null,
    "blockedBy": [],
    "created": "2026-07-28",
    "updated": "2026-07-28",
    "body": "## Problem Statement\n\nUI 변화를 수반하는 요청은 말과 문서만으로는 요청자와 개발자의 화면 기대가 일치했는지 확인할 길이 없다. 현재 시스템은 문서 게시(documented)에서 멈추고 목업 단계(F4)가 통째로 비어 있다 — 요청자는 자기 요청이 어떤 화면이 되는지 승인 전에 볼 수 없고, \"생각했던 것과 다르다\"는 어긋남은 구현이 끝난 뒤에야 드러난다. 시각 방향(디자인 시스템) 역시 어디에도 기록되지 않아, 요청자가 기대한 룩앤필과 개발 결과물의 불일치를 막을 장치가 없다.\n\n## Solution\n\n문서 게시 후 UI 요청으로 분류된 세션에 목업 반복 단계를 연다. Jude가 self-contained 인터랙티브 HTML 목업(중간충실도·그레이스케일·더미데이터·워터마크)을 생성해 URL로 전달하고, 요청자는 화면을 직접 조작해 보고 어노테이션으로 정정을 요청한다. 정정마다 목업 vN+1이 재생성되며, 레이아웃이 수렴하면 디자인 시스템 선정 단계로 넘어간다 — 테마 레지스트리(내장 프리셋 + 외부에서 등록한 테마·디자인 시스템)에서 후보를 같은 목업에 입힌 테마 변형으로 제시하고 요청자가 1택한다. 요청자가 최종 승인하면 반복 과정에서 확정된 사항과 선정된 시각 방향이 requirements vN+1의 문장으로 역주입되고, 목업은 폐기 가능한 상태가 된다(원칙 7).\n\n## User Stories\n\n1. As a 요청자, I want UI 요청의 문서가 게시된 뒤 조작 가능한 목업 URL을 받아서, 내 요청이 어떤 화면이 되는지 승인 전에 눈으로 확인할 수 있다\n2. As a 요청자, I want 비 UI 요청(데이터 수정·리포트·성능 등)에서는 목업 단계가 생략되어서, 불필요한 왕복 없이 슬롯 단위 확인으로 바로 넘어간다\n3. As a 요청자, I want 목업이 클릭·입력이 되는 인터랙티브 화면이어서, 정적 그림으로는 알 수 없는 흐름(탭 전환, 빈 상태, 목록 조작)을 확인할 수 있다\n4. As a 요청자, I want 목업에 \"요구사항 확인용 목업 — 구현 결과 아님\" 워터마크가 항상 보여서, 이것이 완성물이라고 오해하지 않는다\n5. As a 요청자, I want 목업을 보며 내 언어로 어노테이션(정정 요청·코멘트)을 남길 수 있어서, 어긋난 부분을 말로 다시 설명하는 대신 화면에 붙여 지적할 수 있다\n6. As a 요청자, I want 어노테이션을 반영한 목업 vN+1을 받아서, 정정이 실제로 반영됐는지 다음 버전에서 확인할 수 있다\n7. As a 요청자, I want 지금이 몇 번째 반복이고 상한이 몇 회인지 알 수 있어서, 이 왕복이 무한히 이어지지 않는다는 것을 안다\n8. As a 요청자, I want 반복 상한에 도달하면 그 사실과 다음 단계를 안내받아서, 대화가 소리 없이 끊기지 않는다(원칙 5)\n9. As a 요청자, I want 레이아웃이 수렴한 뒤 디자인 시스템 후보들이 같은 목업에 입혀진 테마 변형으로 나란히 제시되어서, 추상적인 이름이 아니라 실제 화면으로 비교해 고를 수 있다\n10. As a 요청자, I want 테마 변형 중 하나를 1클릭으로 선정할 수 있어서, 시각 방향 확정에 별도 왕복이 들지 않는다\n11. As a 요청자, I want \"잘 모르겠다 / 개발팀이 정하는 게 좋겠다\"를 선택할 수 있어서, 원리적으로 답할 수 없는 선택을 강요받지 않는다(승격과 같은 정신)\n12. As a 요청자, I want 목업을 최종 승인하면 반복 중 확정된 사항이 requirements 문서에 흡수된다는 확인을 받아서, 목업에서만 합의되고 증발하는 내용이 없다고 믿을 수 있다\n13. As a 요청자, I want 웹 여정 스테퍼에서 목업 반복이 ③ 단계 위에 표시되어서, 전체 여정 중 내가 어디에 있는지 안다\n14. As a 요청자, I want 목업과 목업 단계의 Jude 안내가 내 선호 언어로 제공되어서, 언어 때문에 확인 품질이 떨어지지 않는다\n15. As a 요청자, I want 목업이 샌드박스된 화면에서 열려서, 생성된 코드가 내 브라우저 세션에 접근하지 못한다\n16. As a 요청자, I want 목업 반복 중에도 기존 슬롯 확인·정정 진입점이 유지되어서, 화면을 보다가 슬롯 값의 오류를 발견하면 문서 정정으로 되돌아갈 수 있다\n17. As a 운영자, I want 테마·디자인 시스템을 외부에서 등록(디자인 토큰·CSS 등)할 수 있어서, 조직 표준 디자인 시스템이 정해지면 코드 수정 없이 후보에 반영된다\n18. As a 운영자, I want 내장 프리셋 테마가 기본 제공되어서, 외부 등록이 없어도 선정 단계가 동작한다\n19. As a 운영자, I want 목업 반복 횟수·어노테이션 밀도·미수렴 에스컬레이션·디자인 시스템 선정이 F11 신호로 버전 귀속과 함께 기록되어서, 명확화가 시각화 전에 수렴하지 못한 정도를 측정할 수 있다\n20. As a 운영자, I want 세션 트레이스에서 목업 버전·어노테이션·선정 이력을 볼 수 있어서, 판독 시 반복 과정을 재구성할 수 있다\n21. As a 운영자, I want 목업 생성 프롬프트가 프롬프트 레지스트리의 버전·회귀 규율을 따라서, 회귀 미통과 버전이 런타임에 로드되지 않는다(배포 게이트)\n22. As a 개발자, I want 목업 승인 시점의 역주입으로 requirements vN+1만 읽어도 구현이 가능해서, 목업을 열어보지 않아도 된다(목업 폐기 가능)\n23. As a 개발자, I want 선정된 시각 방향이 requirements 문서에 기록되어서, 요청자가 확인한 룩앤필을 알고 구현에 착수한다\n24. As a 개발자, I want 목업이 코드가 아니라 URL·이미지 형태로만 전달되어서, 확인용 산출물을 구현 기준으로 오용하지 않는다(하드 제약)\n\n## Implementation Decisions\n\n- **UI 분류기(F4 전제)**: 문서 게시 시점에 LLM 게이트웨이 구조화 호출로 「UI 변화를 수반하는가」를 판정하고 세션에 기록한다. 세션 스키마의 기존 `is_ui_request` 예약 컬럼을 이 판정이 채운다. 비 UI 요청은 현행 흐름(슬롯 확인·정정)을 그대로 유지한다.\n- **상태 전이**: 고정 오케스트레이션 원칙대로 코드 상태 머신이 documented 이후 목업 반복 상태로의 진입·수렴·상한 초과를 결정한다. 정본 상태 머신의 `docgen → mockup → gate` 경로에 대응하되, Phase 0은 승인 게이트 미구현이므로 목업 수렴 또는 상한 도달이 세션의 현재 종점이다.\n- **목업 생성**: 게이트웨이 표준 인터페이스 `complete(promptVersion, input) → structuredOutput`으로 self-contained HTML을 산출한다. 목업 프롬프트는 프롬프트 카탈로그·레지스트리의 버전·회귀 플래그 규율을 동일하게 따른다.\n- **구조 층 / 테마 층 분리**: 목업 HTML은 구조(레이아웃·인터랙션)와 테마(CSS 변수 토큰 층)를 분리해 생성한다. 디자인 시스템 후보 제시는 LLM 재생성 없이 테마 층 교체만으로 이뤄진다 — 후보 간 차이가 시각 방향뿐임을 코드로 보장하고, 비용도 반복당 1회 생성으로 고정된다.\n- **테마 레지스트리**: 내장 프리셋과 외부 등록 테마(디자인 토큰 JSON·CSS 등 파일 기반)를 같은 인터페이스로 로드하는 레지스트리를 둔다. 선정 단계의 후보는 이 레지스트리에서 나온다. 외부 수용은 운영자 지시(2026-07-28) — 조직 표준 디자인 시스템이 정해지면 등록으로 흡수한다.\n- **목업 영속**: 정본 ERD에 예약된 mockup 테이블을 도입한다 — 세션·requirements vN 매핑, 목업 버전, HTML, 어노테이션 기록, 선정 테마, 수렴 상태. requirements_doc의 `back_injected_from` 예약 필드가 역주입 원본 목업을 가리키게 된다.\n- **어노테이션**: Phase 0은 텍스트 코멘트(+선택적 대상 요소 참조)로 시작한다. 어노테이션은 요청자 언어로 받고 세션에 영속된다.\n- **역주입**: 요청자 승인 시 어노테이션에서 확정된 사항과 선정된 시각 방향을 requirements vN+1의 문장으로 흡수한다. 흡수 조립은 프롬프트에 부탁하지 않고 코드 강제 구간에서 보장한다(기존 문서 조립 함수의 선례). 흡수 후 목업은 폐기 가능해야 한다.\n- **반복 상한**: 기본 3회(§12 결정 대기 수치 — 설정으로 교체 가능). 상한 도달 시 미수렴 표기와 함께 종료하고 사유를 요청자에게 회신하며 F11 신호로 남긴다.\n- **호스팅(Phase 0)**: 웹 어댑터가 목업 HTML을 CSP `sandbox` + `default-src 'none'` 헤더로 서빙한다. web-ui 뷰어는 `sandbox=\"allow-scripts\"`(allow-same-origin 배제) iframe으로 표시하고 postMessage origin을 검증한다. 워터마크는 상시. 분리 usercontent 도메인·만료 서명 URL은 결정 대기(Phase 2 권장선 유지).\n- **웹 표면**: web-ui에 목업 뷰어(iframe + 버전 표시 + 어노테이션 입력 + 테마 후보 비교·선정 UI)를 추가하고 여정 스테퍼 ③에 목업 반복을 반영한다. 요청자 대면 카피는 Jude 목소리를 따른다(페르소나 문서 우선).\n- **신호와 트레이스**: 목업 반복 횟수·어노테이션 밀도·미수렴 에스컬레이션·디자인 시스템 선정을 F11 신호로 기록하고 버전 귀속 5축에 묶는다. 세션 저장소 쓰기가 새로 생기므로 상시 지시에 따라 트레이스 렌더링을 함께 확장한다.\n- **PRD 정합(개정 필요 명시)**: (1) F4의 그레이스케일 규정 — 레이아웃 반복은 그레이스케일을 유지하고, 수렴 후 선정 단계에서만 테마 변형을 허용하는 예외를 F4·CONTEXT.md 목업 정의에 개정으로 반영한다. (2) requirements 「어떻게 비움」 원칙 — 선정 결과는 구현 스택 강제가 아니라 요청자 확인을 거친 「확정된 시각 방향」으로 기록하며, 구현 수단 선택은 개발팀 재량으로 남는다.\n\n## Testing Decisions\n\n- 좋은 테스트는 외부 행동만 검증한다 — 포트에 게시된 회신(목업 URL·안내문), 저장소 행(목업 버전·어노테이션·선정·문서 vN+1), HTTP 응답·헤더. 프롬프트 본문이나 내부 호출 순서는 검증하지 않는다.\n- **주 심: CoreRunner 심(기존)** — 스크립트된 가짜 백엔드 + 인메모리 채널 포트 + SQLite로 「UI 분류 → 목업 게시 → 어노테이션 → vN+1 → 수렴 → 테마 선정 → 역주입」 전 과정을 통과시킨다. 선례: core-runner 테스트 스위트.\n- **보조 심: 웹 HTTP 계약(기존)** — 목업 서빙 라우트의 CSP 헤더, 어노테이션 게시, 테마 후보 조회·선정 API. 선례: web-server 테스트 스위트.\n- **보조 심: 트레이스(기존, 상시 지시)** — 새 저장 행이 트레이스에 렌더링되는지. 선례: trace 테스트 스위트.\n- 테마 레지스트리의 외부 등록은 파일 픽스처로 검증한다(외부 네트워크 비의존).\n- 신설 심 0개 — 세 심 모두 기존 테스트 스위트의 확장이다.\n\n## Out of Scope\n\n- 승인 게이트(F5)와 Linear 이슈 생성(F6) — 흡수 완료의 게이트 표시, 이슈 본문의 목업 링크 동봉은 해당 기능 구현 시 합류한다.\n- 실 호스팅 인프라(R2 + Workers, 만료 서명 URL, 분리 usercontent 도메인) — Phase 0은 로컬 웹 어댑터 서빙으로 대체한다.\n- Slack 표면의 목업 반복 — 웹 우선 검증(ADR-0007)에 따라 웹 표면만 구현한다.\n- 요소 위 시각적 어노테이션 편집기(핀 찍기·드로잉) — 텍스트 어노테이션으로 시작한다.\n- 판독 큐(F13)의 「어노테이션 대비 문서 반영 누락」 점검 항목 — F13 구현 시 합류한다.\n- 반복 상한·수렴 판정 수치의 최종 확정(§12) — 기본값 3회로 시작하고 운영자 결정 시 교체한다.\n\n## Further Notes\n\n- 하드 제약 재확인: 목업 코드는 개발팀에 전달되지 않는다 — URL·이미지 형태만. 이 제약은 역주입이 존재하는 이유이기도 하다(목업에만 있는 확정 사항은 공식적으로 아무 데도 없는 정보가 된다).\n- 이 스펙은 PRD F4의 Phase 2 예정 컴포넌트(목업 서비스 + 역주입기)를 Phase 0 웹 표면 위에서 앞당겨 구현하는 결정이며, 디자인 시스템 선정 단계는 F4 원문에 없는 신설이다 — 위 「PRD 정합」 항목의 개정을 구현과 같은 변경 단위에서 수행한다.\n- 테스트 심 선택(기존 CoreRunner 심 확장)과 선정 방식(테마 변형 제시 → 요청자 1택 + 외부 테마 수용)은 운영자와 확인을 마쳤다(2026-07-28).",

    "body": "## Problem Statement\n\n백엔드 로그([usage] 사용량, [web] 라운드 실패 등)가 콘솔에만 흐르고 사라진다. LLM 에이전트가 타임아웃 같은 런타임 실패를 조사하려면 운영자가 콘솔 출력을 복사해 붙여줘야 한다 — 에이전트가 스스로 읽을 수 있는 영속 로그가 없다.\n\n## Solution\n\n콘솔 출력을 유지하면서 같은 내용을 롤링 로테이트 파일에 병행 기록한다(tee). 엔트리포인트별 파일(`data/logs/web.log`, `slack.log`, `intake.log`, `retro.log`)로 프로세스 간 로테이션 경합을 피하고, 기본 경로·정책을 AGENTS.md에 기술해 에이전트가 세션 시작 시점부터 로그 위치를 안다.\n\n## Implementation Decisions\n\n- 신규 `src/log/` 모듈: 롤링 파일 sink(`maxBytes` 초과 시 `web.log → web.log.1 → …` 시프트, `maxFiles` 초과분 삭제, 부모 디렉터리 자동 생성. 기본 5MB × 5개).\n- 콘솔 티: `console.log/warn/error`를 감싸 기존 stdout/stderr 출력을 그대로 두고 ISO 타임스탬프 라인을 sink에 추가 기록. 운영자가 보는 콘솔 출력은 변하지 않는다.\n- 배선: 백엔드 CLI 엔트리포인트 4곳(web·slack·intake·retro) 시작부 1줄. `PMJUDE_LOG_FILE`로 경로 오버라이드.\n- `data/`는 gitignore 대상 — 로그가 리포에 들어가지 않는다.\n- AGENTS.md에 Backend logs 섹션(영어) 추가.\n\n## Testing Decisions\n\n- 시임 2곳 확정(운영자 확인 2026-07-29): (1) 롤링 sink의 write/로테이션 동작 — 임시 디렉터리 파일시스템 검증, (2) 콘솔 티의 원본 출력 유지 + sink 기록 동작. 엔트리포인트 배선은 얇은 코드로 두고 단위 테스트 제외.\n\n## Out of Scope\n\n- 구조화(JSONL) 로그 포맷, 로그 레벨 체계, 외부 로그 수집기 연동.\n- web-ui(Next.js) 쪽 로그 — 백엔드 프로세스만 대상.\n- 게이트웨이 120s 타임아웃 상한 자체의 조정(별도 결정).",

    "updated": "2026-07-29",
    "body": "## Problem Statement\n\n게이트웨이 상한 120s(DEFAULT_TIMEOUT_MS)가 모든 프롬프트 호출에 일률 적용된다. 장문 생성인 requirements@0.2.0이 반복적으로 120s를 초과해 GatewayTimeoutError로 라운드가 죽는다(2026-07-29 운영 로그 — completeness는 5.5k 토큰 출력에 79s, 약 70토큰/초이므로 문서 전체를 내는 requirements는 구조적으로 상한을 넘는다). 폭주 방지와 정상 장문 생성 차단이 한 숫자에 뭉뚱그려져 있다.\n\n## Solution\n\n프롬프트 버전이 자기 상한을 선언한다 — PromptVersion에 선택 필드 timeoutMs 추가, 게이트웨이는 version.timeoutMs ?? options.timeoutMs ?? 120s 순으로 적용. 장문 생성 프롬프트(completeness-v1·requirements-v1·mockup-v0·back-injection-v0)만 300s를 선언하고, 단문 호출(clarification·promotion·ui-classification·attachment-extraction)은 120s 기본을 유지해 폭주 방지의 의미를 보존한다.\n\n## Implementation Decisions\n\n- 상한 선언 위치는 프롬프트 모듈 — 출력 크기를 아는 주체가 프롬프트 자신이다. 게이트웨이 옵션 promptRef별 오버라이드 방식은 배선 지점마다 설정 반복이 생겨 배제.\n- 버전 불변 원칙과의 관계: timeoutMs는 프롬프트 계약(본문·스키마)이 아니라 실행 봉투(운영 파라미터)로 본다 — 기존 semver 유지, 신호 귀속 불변.\n- 구 버전(v0 계열)은 런타임에서 참조되지 않으므로 무변경.\n- 레지스트리가 timeoutMs > 0 정수를 검증한다(등록 시점 거부 — 기존 name/semver 검증과 같은 정신).\n- 타임아웃 재시도는 도입하지 않는다(비용 폭주 트레이드오프 — 별도 결정으로 남김).\n\n## Testing Decisions\n\n- 신설 심 0개 — 기존 게이트웨이 스위트(tests/gateway.test.ts) 확장: 버전 선언 상한이 전역 옵션보다 우선 적용, 선언 상한 초과 시 GatewayTimeoutError. 레지스트리 검증은 기존 등록 검증 테스트 계열에 추가.\n\n## Out of Scope\n\n- 타임아웃 1회 재시도, 비활성(inactivity) 타임아웃, 백엔드 스트리밍 소비 개선.",

    "created": "2026-07-29",
    "updated": "2026-07-29",
    "body": "## Problem Statement\n\n요구사항 문서가 노션으로 작성되는 경우, 요청자는 노션 링크를 붙여넣지만 시스템은 링크를 읽지 못한다. 실제 사고(세션 49597175, 2026-07-29): 링크가 무시되자 요청자가 노션 PRD 본문 134k자를 대화에 통째로 붙여넣었고, requirements 생성이 300s 상한에서도 타임아웃했다(#56 코멘트·#58 참조).\n\n## Solution\n\n요청자 발화의 노션 URL을 감지해 페이지를 페치하고 `<페이지제목>.md` 첨부로 저장한다. text/markdown은 이미 등록된 MIME이라 이후는 기존 F1-Attach 파이프라인(원본 불변·추출 캐시·세션 텍스트 예산·근거 참조·판독 귀속)이 그대로 적용된다.\n\n## Implementation Decisions\n\n- 모듈 `src/connect/notion.ts` 하나 — 인터페이스는 detectNotionUrls(text) + fetchPage(url) 둘. URL→ID 추출, 인증(NOTION_API_KEY 내부 통합 토큰), 블록 재귀·페이지네이션, rate limit 대기, 블록→markdown 환원은 구현 뒤에 숨는다.\n- 배선은 라운드 백그라운드 첫 단계(첨부 추출과 같은 자리) — 게이트웨이 봉투 밖이라 LLM 타임아웃과 무관. 페치 자체 예산(페이지당 시간 상한·세션당 페이지 수 상한)을 둔다.\n- 실패는 결과다(P-U3): 미공유·권한·404는 사유를 단 추출 실패로 남아 요청자가 \"통합에 페이지를 공유해 달라\"를 알게 된다.\n- attachment.source_url 컬럼 신설(마이그레이션) — 출처 기록 + 라운드 간 재페치 방지.\n- NOTION_API_KEY 미설정이면 커넥터 꺼짐(현행 동작 유지). .env.example은 통합 시점 편집.\n- API 사실관계는 docs/research/의 노션 API 조사 노트 참조(1차 소스 조사).\n\n## Testing Decisions\n\n- 신설 심 1곳: NotionConnector 인터페이스 — fetch 함수 주입으로 페이지네이션·재귀·rate limit 대기·실패 분류를 픽스처로 검증. URL 감지·ID 추출은 순수 함수 테스트.\n- 배선은 기존 CoreRunner 심 확장: URL 포함 발화 → 첨부 행 생성 → 추출 합류 → 근거 참조까지.\n\n## Out of Scope\n\n- 노션 데이터베이스(행 컬렉션) 페치 — 페이지만. ?v= 뷰 링크는 페이지 ID만 취한다.\n- F2a 검색 소스로서의 노션, requirements의 노션 발행(출력) — 방향은 확정(2026-07-29), 별도 티켓.\n- 첨부 이미지·파일 블록의 재귀 다운로드.",

    "body": "## Problem Statement\n\n세션 텍스트 예산(200k자)과 생성 봉투(300s ≈ 관측 72tok/s로 ~21k토큰)가 맞지 않는다. 실측: 134k자 소스가 대화로 유입되자 requirements 생성이 300s에도 미완(2026-07-29 로그). 구멍이 둘이다 — (1) 붙여넣기 발화에는 어떤 상한도 없고, (2) 정상 첨부 경로로도 200k자가 프롬프트에 그대로 실려 같은 폭발이 재현된다.\n\n## Solution\n\n세 층의 입력 규율: ① 요청자 발화 길이 상한(초과는 사유와 함께 거부 + \"파일 첨부/링크\" 안내), ② 장문 첨부는 추출 시점에 LLM 1회 압축(사실·수치·표 보존) — 원문 extracted_text는 그대로 두고 condensed_text를 별도 저장(운영자 확인 2026-07-29), ③ 프롬프트 조립 시점에 첨부 텍스트 총량 예산 — 초과분은 압축본으로 대체(전량 압축 시 예산 내 수렴이 산술적으로 보장되는 수치로 설정).\n\n## Implementation Decisions\n\n- 발화 상한 기본 10k자 — 업로드 거부(UploadRejectedError)와 같은 정신으로 접수 전 거부, 요청자 언어로 안내.\n- 압축 트리거 20k자, 압축 목표 ≤6k자, 조립 예산 = maxPerSession(10) × 6k = 60k자 — 전량 압축이면 반드시 예산 안. 수치는 §12식 결정 대기 기본값(설정 교체 가능).\n- 압축은 새 프롬프트 버전(condensation@0.1.0)으로 카탈로그·레지스트리 규율을 따른다. 요청 맥락 비의존이라 캐시 성립(ADR-0011 정합). 이미지 추출기의 게이트웨이 사용 선례.\n- 압축 출력이 목표 길이 초과 시 1회 재시도 후 명시 마커와 함께 절단 — 조용한 절단 금지.\n- ADR 0013/0014로 결정 기록, PRD §12 수치 목록 갱신.\n\n## Testing Decisions\n\n- 기존 심 확장: CoreRunner(발화 상한 거부 회신, 장문 첨부 세션의 requirements 입력이 압축본으로 대체), 추출(압축 트리거·저장), 게이트웨이/프롬프트 레지스트리(condensation 등록).\n\n## Out of Scope\n\n- requirements 분할 생성(섹션별 다중 호출), 대화 이력 요약, maxSessionTextChars 자체 변경.",

    "body": "## Problem Statement\n\n설정이 환경변수 단독으로 관리되고 있고 그마저 일관되지 않다. 환경변수 14종이 CLI 엔트리포인트 4곳에 흩어져 기본값이 중복되고(PMJUDE_DB_PATH·PMJUDE_MAX_ROUNDS 각 4곳), .env.example이 문서화한 PMJUDE_LLM_TIMEOUT_MS·PMJUDE_LLM_MAX_CONCURRENCY는 어디에서도 읽지 않는 죽은 설정이다. 코드 내 기본값(첨부 상한·압축 수치·왕복 상한·로그 로테이션)도 모듈별 상수로 산재한다. 운영자 지시(2026-07-29): 기본 설정 → 통합 설정 파일 → 환경변수 주입 순서의 레이어드 설정.\n\n## Solution\n\n깊은 모듈 하나 — src/config.ts, 인터페이스는 loadConfig() 단일 함수. ① 기본값은 zod 스키마 .default()가 단일 원천, ② 리포 루트 pm-jude.config.json(위치는 PMJUDE_CONFIG로 교체) 파일 층, ③ env var → 설정 경로 명시 매핑 + 타입 강제의 env 층이 순서대로 겹친다. 엔트리포인트는 loadConfig() 1회 호출 후 값을 내려보낸다 — 러너·서버 deps는 이미 값 주입 구조라 시임 불변.\n\n## Implementation Decisions\n\n- 형식 JSON(의존성 0, 운영자 확정 2026-07-29). 실파일은 gitignore, pm-jude.config.example.json만 커밋 — 토큰을 파일에 둘 수 있는 전제.\n- 비밀 4종(ANTHROPIC·SLACK·NOTION·LINEAR)은 파일·env 양쪽 허용, env가 최종 우선(운영자 확정).\n- 파일 부재는 정상, 파싱·스키마 실패와 미지 키는 기동 시점 명시 거부(미등록 MIME 거부와 같은 철학).\n- 기존 env var 이름 전부 보존 — 하위 호환. 죽은 설정 2종(LLM 타임아웃·동시성)은 게이트웨이 생성까지 배선해 되살린다(IntakeRunnerDeps.llm).\n- 코드 산재 기본값(첨부 상한·압축·발화 상한·노션 페이지 상한·왕복 상한·목업 상한·로그)을 스키마 기본값으로 승격.\n- web-ui(Next)와 scripts/demo.mjs는 범위 밖 — 백엔드 src/만.\n\n## Testing Decisions\n\n- 신설 심 1곳: loadConfig({ filePath, env }) 주입 — 기본값·파일 오버라이드·env 최종 우선·파일 부재·JSON 오류·미지 키 거부·타입 강제를 픽스처로 검증.\n- 게이트웨이 상한 배선은 기존 러너 심 확장 1건.\n\n## Out of Scope\n\n- 설정 핫리로드, 다중 프로파일(dev/prod), web-ui 설정 통합.",

    "body": "## Problem Statement\n\n#58은 대화 이력을 Out of Scope로 뺐고, 세션 49597175가 그 제외가 틀렸음을 증명했다 — 134k자 노션 PRD가 첨부가 아니라 **대화 답변**(발화 seq 7)으로 들어와 있어, 발화 상한(신규 입구 차단)도 첨부 압축(생성 뷰)도 닿지 않는다. requirements 생성 입력의 clarifications에 전문이 실려 300s 상한에서도 미완이고, 발화는 불변이라 지울 수 없다 — 이 세션은 영구 미완이다. 정정 루프(왕복 미산입)로 10k짜리 발화가 누적되는 경로도 같은 구멍이다.\n\n## Solution\n\nADR-0014의 판정 전문·생성 압축 규율을 대화에도 적용한다. 생성 호출의 request·clarifications에서 압축 목표를 넘는 요청자 발화는 압축본(표시 포함)으로 대체하고, 판정 호출은 계속 전문을 받는다. 압축은 발화 단위로 요청 맥락 비의존 — utterance.condensed_text 파생 컬럼에 캐시(원문 불변 트리거는 original_text만 보호하므로 충돌 없음). 예산은 첨부·대화 합산 하나로 본다 — 생성 봉투가 보는 것은 총량이다.\n\n## Implementation Decisions\n\n- 라운드 백그라운드의 압축 단계를 소스 통합으로 확장: 투영 총량 = 첨부(압축본 ?? 원문) + 요청자 발화(압축본 ?? 원문). 예산 초과 시 목표 초과 후보(첨부·발화 불문)를 큰 것부터 압축 — ADR-0014 결정 4의 총량 인지 규칙 유지.\n- 발화 압축도 condensation@0.1.0 재사용(입력 filename 자리에 「대화 발화 N」 라벨). utterance_condensed 신호로 귀속.\n- 생성 뷰 대체는 buildConversation이 스태시한 발화 id 매핑으로 — LLM 입력 형태({question, answer})는 불변.\n- 검증: 이 티켓 랜딩 후 세션 49597175에서 재시도 → 완주가 실전 회귀 케이스.\n- ADR-0014에 확장 각주 추가.\n\n## Testing Decisions\n\n- 기존 심 확장(코어 러너): 장문 답변 세션에서 판정 입력은 전문·requirements 입력은 표시된 압축본, utterance.condensed_text 캐시, 총량 이내 세션은 무압축. trace 동반(발화 압축 길이).\n\n## Out of Scope\n\n- 에이전트 발화 압축(질문은 짧다), 대화 요약(rolling summary), maxRounds 밖 정정 루프 횟수 상한.",

    "body": "## Problem Statement\n\n운영자 관찰(2026-07-29, 세션 49597175): 3개 라운드가 같은 질문(\"UA가 무엇인가\")을 재탕했다 — 답변 기반의 심화 없이 매 라운드가 1라운드처럼 시작한다. 기계적 원인 확인: 명확화 호출(CLARIFICATION_V2)의 입력이 request 원문 + 슬롯 이진 상태(filled/unfilled) + 첨부뿐이다. **대화 이력(기질문·답변)이 실리지 않아** 모델은 무엇을 이미 물었는지 알 수 없고, 완결성 판정의 rationale·remainingAmbiguities(심화 질문의 재료)도 전달되지 않는다.\n\n## Solution (초안 — 설계 논의 필요)\n\n질문 생성 입력에 ① conversation(기질문·답변 전체 — 판정 호출과 같은 전문 규율), ② 직전 완결성 판정의 슬롯별 rationale과 remainingAmbiguities, ③ \"이미 물은 것을 다시 묻지 말고, 부분 답변은 그 답을 인용하며 더 좁고 깊은 후속 질문으로 진행하라\"는 심화 지시를 추가한다. 프롬프트 본문·입력 계약이 바뀌므로 clarification@0.4.0 신설(버전 불변 규율). 프롬프트 3~5문항 상한과 왕복 상한의 상호작용(같은 슬롯 재질문 몇 회까지 허용?)은 설계 시 결정.\n\n## 증거\n\n- 세션 49597175 발화 seq 2·4·6 — 1번 질문이 3회 모두 UA 의미 확인의 재표현.\n- src/runner/core-runner.ts CLARIFICATION_V2 호출부 — conversation 필드 부재.\n\n## Out of Scope\n\n- 왕복 상한 수치 변경, 승격 판정 로직.",

<header>
  <div class="wordmark">pm-jude <em>· issue ledger</em></div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <input id="q" type="search" placeholder="검색 — 제목 · 본문 · #번호" autocomplete="off">
</header>

<div id="error"></div>
<div id="void">
  <div class="big">ledger empty</div>
  등록된 이슈 없음<br>
  이 파일의 <span class="mono">issues-data</span> JSON 블록에 이슈 객체 추가 → 새로고침
</div>
<main id="board"></main>

<div id="overlay">
  <div id="panel">
    <button id="close">ESC 닫기</button>
    <div class="cid" id="p-id"></div>
    <h2 id="p-title"></h2>
    <dl class="facts" id="p-facts"></dl>
    <div class="body-md" id="p-body"></div>
    <div class="comments" id="p-comments"></div>
  </div>
</div>

<script>
'use strict';
const ROLES = ['needs-triage','needs-info','ready-for-agent','ready-for-human'];
const COLS = [
  { key:'none',   cls:'c-none',   name:'unlabeled' },
  { key:'needs-triage',    cls:'c-triage', name:'needs-triage' },
  { key:'needs-info',      cls:'c-info',   name:'needs-info' },
  { key:'ready-for-agent', cls:'c-agent',  name:'ready-for-agent' },
  { key:'ready-for-human', cls:'c-human',  name:'ready-for-human' },
  { key:'closed', cls:'c-closed', name:'closed' },
];

let issues = [];
try {
  issues = JSON.parse(document.getElementById('issues-data').textContent);
  if (!Array.isArray(issues)) throw new Error('최상위 값이 배열이 아님');
} catch (e) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.textContent = 'issues-data JSON 파싱 실패 — 데이터 블록을 수정한 후 새로고침하세요.\n' + e.message;
}

const byId = new Map(issues.map(i => [i.id, i]));
const pad = n => '#' + String(n).padStart(3, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function columnOf(it){
  if (it.state === 'closed' || (it.labels||[]).includes('wontfix')) return 'closed';
  for (const r of ROLES) if ((it.labels||[]).includes(r)) return r;
  return 'none';
}
function openBlockers(it){
  return (it.blockedBy||[]).filter(id => { const b = byId.get(id); return b && b.state !== 'closed'; });
}

// 최소 마크다운 렌더러: 펜스 코드 → 이스케이프 → 블록/인라인
function md(src){
  if (!src) return '';
  const fences = [];
  src = String(src).replace(/```([^\n]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    fences.push('<pre><code>' + esc(code) + '</code></pre>');
    return '\u0000F' + (fences.length - 1) + '\u0000';
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  for (const block of src.split(/\n{2,}/)) {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) continue;
    const h = lines[0].match(/^(#{1,3})\s+(.*)/);
    if (h && lines.length === 1) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (lines.every(l => /^[-*]\s+/.test(l))) {
      out.push('<ul>' + lines.map(l => '<li>' + inline(l.replace(/^[-*]\s+/, '')) + '</li>').join('') + '</ul>'); continue;
    }
    if (lines.every(l => /^\d+\.\s+/.test(l))) {
      out.push('<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\d+\.\s+/, '')) + '</li>').join('') + '</ol>'); continue;
    }
    out.push('<p>' + lines.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n').replace(/\u0000F(\d+)\u0000/g, (_, i) => fences[i]);
}

function matches(it, q){
  if (!q) return true;
  q = q.toLowerCase();
  return (pad(it.id) + ' ' + (it.title||'') + ' ' + (it.body||'')).toLowerCase().includes(q);
}

function render(){
  const q = document.getElementById('q').value.trim();
  const board = document.getElementById('board');
  board.innerHTML = '';
  const openN = issues.filter(i => i.state !== 'closed').length;
  document.getElementById('stats').innerHTML = `open <b>${openN}</b> · closed <b>${issues.length - openN}</b>`;
  document.getElementById('void').style.display = issues.length ? 'none' : 'block';
  if (!issues.length) return;

  let ci = 0, cardSeq = 0;
  for (const col of COLS) {
    const items = issues.filter(i => columnOf(i) === col.key && matches(i, q)).sort((a, b) => a.id - b.id);
    if (col.key === 'none' && !items.length) continue;
    const sec = document.createElement('section');
    sec.className = 'col ' + col.cls;
    sec.style.animationDelay = (ci++ * 55) + 'ms';
    sec.innerHTML = `<div class="col-head"><span class="dot"></span><h2>${col.name}</h2><span class="n">${items.length}</span></div>`;
    if (!items.length) sec.insertAdjacentHTML('beforeend', '<div class="empty-col">—</div>');
    for (const it of items) {
      const card = document.createElement('article');
      card.className = 'card' + (it.state === 'closed' ? ' closed' : '');
      card.style.animationDelay = (Math.min(cardSeq++, 14) * 35) + 'ms';
      const extras = (it.labels||[]).filter(l => l !== col.key).map(l => `<span class="chip">${esc(l)}</span>`);
      if (it.type) extras.push(`<span class="chip">${esc(it.type)}</span>`);
      if (it.assignee) extras.push(`<span class="chip">@${esc(it.assignee)}</span>`);
      const nc = (it.comments||[]).length;
      if (nc) extras.push(`<span class="chip">✉ ${nc}</span>`);
      const blk = openBlockers(it);
      if (blk.length) extras.push(`<span class="chip blocked">⊘ ${blk.map(pad).join(' ')}</span>`);
      card.innerHTML = `<span class="cid">${pad(it.id)}</span><h3>${esc(it.title||'(제목 없음)')}</h3><div class="meta">${extras.join('')}</div>`;
      card.onclick = () => show(it);
      sec.appendChild(card);
    }
    board.appendChild(sec);
  }
}

function show(it){
  const col = COLS.find(c => c.key === columnOf(it));
  document.getElementById('panel').style.setProperty('--panel-accent', `var(--${col.cls})`);
  document.getElementById('p-id').textContent = pad(it.id);
  document.getElementById('p-title').textContent = it.title || '(제목 없음)';
  const facts = [
    ['state', it.state], ['labels', (it.labels||[]).join(', ') || '—'],
    ['assignee', it.assignee || '—'], ['dates', [it.created, it.updated].filter(Boolean).join(' → ') || '—'],
  ];
  if (it.type) facts.push(['type', it.type]);
  if (it.parent != null) facts.push(['parent', pad(it.parent)]);
  if ((it.blockedBy||[]).length) facts.push(['blocked by', it.blockedBy.map(pad).join(', ')]);
  document.getElementById('p-facts').innerHTML = facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  document.getElementById('p-body').innerHTML = md(it.body) || '<p style="color:var(--muted-foreground)">본문 없음</p>';
  const cs = it.comments || [];
  document.getElementById('p-comments').innerHTML = cs.length
    ? cs.map(c => `<div class="comment"><div class="who">${esc(c.author||'?')} · ${esc(c.date||'')}</div><div class="body-md">${md(c.body)}</div></div>`).join('')
    : '';
  document.getElementById('overlay').classList.add('on');
}

document.getElementById('overlay').onclick = e => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('on'); };
document.getElementById('close').onclick = () => document.getElementById('overlay').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('overlay').classList.remove('on'); });
document.getElementById('q').addEventListener('input', render);
render();
</script>
