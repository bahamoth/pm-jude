<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pm-jude · Issue Ledger</title>
<style>
  :root{
    --paper:#f5f2ec; --ink:#211d18; --ink-soft:#6b6357; --hairline:#d9d2c4;
    --card:#fdfbf7; --card-edge:#e4ddd0; --accent:#b4430e;
    --chip-bg:#ece7dc; --shadow:0 1px 2px rgba(33,29,24,.06),0 8px 24px rgba(33,29,24,.07);
    --c-none:#8a8274; --c-triage:#b4430e; --c-info:#976a08; --c-agent:#0e7268; --c-human:#295bb8; --c-closed:#8a8274;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#161310; --ink:#e9e2d4; --ink-soft:#968d7d; --hairline:#332d25;
      --card:#1f1b16; --card-edge:#383127; --accent:#e8703a;
      --chip-bg:#2a251e; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
      --c-none:#7d7669; --c-triage:#e8703a; --c-info:#d1a12e; --c-agent:#3aa89a; --c-human:#6f97e8; --c-closed:#7d7669;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light dark}
  body{
    font:15px/1.55 "Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh;
    background-image:repeating-linear-gradient(45deg,transparent 0 11px,rgba(128,110,80,.025) 11px 12px);
  }
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  header{
    border-top:3px solid var(--ink); border-bottom:1px solid var(--hairline);
    padding:26px 32px 18px; display:flex; flex-wrap:wrap; gap:14px 28px; align-items:baseline;
  }
  .wordmark{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .wordmark em{font-style:italic;color:var(--accent)}
  .stats{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .stats b{color:var(--ink);font-weight:600}
  .spacer{flex:1}
  #q{
    font:13px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    background:none;border:none;border-bottom:1px solid var(--hairline);
    color:var(--ink);padding:7px 2px;width:min(300px,60vw);outline:none;transition:border-color .18s;
  }
  #q:focus{border-bottom-color:var(--accent)}
  #q::placeholder{color:var(--ink-soft);opacity:.7}

  #error{
    display:none;margin:20px 32px;padding:14px 18px;border:1px solid var(--c-triage);
    color:var(--c-triage);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;
  }

  #board{display:flex;gap:20px;padding:28px 32px 48px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 120px)}
  .col{flex:0 0 282px;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
  .col-head{
    display:flex;align-items:baseline;gap:8px;padding:0 2px 10px;margin-bottom:14px;
    border-bottom:2px solid var(--col-accent,var(--ink));
  }
  .col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--col-accent);align-self:center}
  .col-head h2{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  .col-head .n{margin-left:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft)}
  .col.c-none  {--col-accent:var(--c-none)}
  .col.c-triage{--col-accent:var(--c-triage)}
  .col.c-info  {--col-accent:var(--c-info)}
  .col.c-agent {--col-accent:var(--c-agent)}
  .col.c-human {--col-accent:var(--c-human)}
  .col.c-closed{--col-accent:var(--c-closed)}

  .card{
    background:var(--card);border:1px solid var(--card-edge);border-left:3px solid var(--col-accent);
    padding:12px 14px 11px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s;
    animation:rise .45s cubic-bezier(.22,1,.36,1) both;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(33,29,24,.08),0 14px 32px rgba(33,29,24,.12)}
  .card .cid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--col-accent);letter-spacing:.08em}
  .card h3{font-size:14.5px;font-weight:600;line-height:1.4;margin:4px 0 7px}
  .card.closed h3{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--hairline)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.06em;
    background:var(--chip-bg);color:var(--ink-soft);padding:2.5px 7px;border-radius:2px;
  }
  .chip.blocked{color:var(--c-triage);background:transparent;border:1px dashed var(--c-triage)}
  .empty-col{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-soft);opacity:.6;padding:6px 2px}

  #void{
    display:none;text-align:center;padding:90px 32px;color:var(--ink-soft);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.05em;line-height:2.1;
  }
  #void .big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-style:italic;color:var(--ink);letter-spacing:0}

  #overlay{
    display:none;position:fixed;inset:0;background:rgba(20,16,11,.45);backdrop-filter:blur(3px);
    z-index:10;padding:6vh 20px;overflow-y:auto;
  }
  #overlay.on{display:block}
  #panel{
    max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--card-edge);
    border-top:3px solid var(--panel-accent,var(--accent));box-shadow:var(--shadow);
    padding:30px 36px 34px;animation:rise .3s cubic-bezier(.22,1,.36,1) both;
  }
  #panel .cid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--panel-accent,var(--accent));letter-spacing:.1em}
  #panel h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:24px;font-weight:600;line-height:1.3;margin:6px 0 16px}
  .facts{
    display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;
    border-block:1px solid var(--hairline);padding:12px 0;margin-bottom:20px;
  }
  .facts dt{color:var(--ink-soft);text-transform:uppercase;letter-spacing:.12em}
  .facts dd{color:var(--ink)}
  .body-md{font-size:14.5px}
  .body-md h1,.body-md h2,.body-md h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;margin:18px 0 8px;line-height:1.3}
  .body-md h1{font-size:20px}.body-md h2{font-size:17px}.body-md h3{font-size:15px}
  .body-md p{margin:0 0 10px}
  .body-md ul,.body-md ol{margin:0 0 10px 22px}
  .body-md li{margin-bottom:3px}
  .body-md code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88em;background:var(--chip-bg);padding:1.5px 5px;border-radius:2px}
  .body-md pre{background:var(--chip-bg);padding:12px 14px;overflow-x:auto;margin:0 0 12px;border-left:2px solid var(--hairline)}
  .body-md pre code{background:none;padding:0}
  .body-md a{color:var(--accent)}
  .comments{margin-top:26px;border-top:1px solid var(--hairline);padding-top:6px}
  .comment{border-bottom:1px dashed var(--hairline);padding:14px 0}
  .comment .who{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  #close{
    float:right;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;
    background:none;border:1px solid var(--hairline);color:var(--ink-soft);padding:6px 12px;cursor:pointer;
  }
  #close:hover{border-color:var(--accent);color:var(--accent)}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
const ROLES = ['needs-triage','needs-info','ready-for-agent','ready-for-human'];
const COLS = [
  { key:'none',   cls:'c-none',   name:'unlabeled' },
  { key:'needs-triage',    cls:'c-triage', name:'needs-triage' },
  { key:'needs-info',      cls:'c-info',   name:'needs-info' },
  { key:'ready-for-agent', cls:'c-agent',  name:'ready-for-agent' },
  { key:'ready-for-human', cls:'c-human',  name:'ready-for-human' },
  { key:'closed', cls:'c-closed', name:'closed' },
];

let issues = [];
try {
  issues = JSON.parse(document.getElementById('issues-data').textContent);
  if (!Array.isArray(issues)) throw new Error('최상위 값이 배열이 아님');
} catch (e) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.textContent = 'issues-data JSON 파싱 실패 — 데이터 블록을 수정한 후 새로고침하세요.\n' + e.message;
}

const byId = new Map(issues.map(i => [i.id, i]));
const pad = n => '#' + String(n).padStart(3, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function columnOf(it){
  if (it.state === 'closed' || (it.labels||[]).includes('wontfix')) return 'closed';
  for (const r of ROLES) if ((it.labels||[]).includes(r)) return r;
  return 'none';
}
function openBlockers(it){
  return (it.blockedBy||[]).filter(id => { const b = byId.get(id); return b && b.state !== 'closed'; });
}

// 최소 마크다운 렌더러: 펜스 코드 → 이스케이프 → 블록/인라인
function md(src){
  if (!src) return '';
  const fences = [];
  src = String(src).replace(/```([^\n]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    fences.push('<pre><code>' + esc(code) + '</code></pre>');
    return '␀F' + (fences.length - 1) + '␀';
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  for (const block of src.split(/\n{2,}/)) {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) continue;
    const h = lines[0].match(/^(#{1,3})\s+(.*)/);
    if (h && lines.length === 1) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (lines.every(l => /^[-*]\s+/.test(l))) {
      out.push('<ul>' + lines.map(l => '<li>' + inline(l.replace(/^[-*]\s+/, '')) + '</li>').join('') + '</ul>'); continue;
    }
    if (lines.every(l => /^\d+\.\s+/.test(l))) {
      out.push('<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\d+\.\s+/, '')) + '</li>').join('') + '</ol>'); continue;
    }
    out.push('<p>' + lines.map(inline).join('<br>') + '</p>');
  }
  return out.join('\n').replace(/␀F(\d+)␀/g, (_, i) => fences[i]);
}

function matches(it, q){
  if (!q) return true;
  q = q.toLowerCase();
  return (pad(it.id) + ' ' + (it.title||'') + ' ' + (it.body||'')).toLowerCase().includes(q);
}

function render(){
  const q = document.getElementById('q').value.trim();
  const board = document.getElementById('board');
  board.innerHTML = '';
  const openN = issues.filter(i => i.state !== 'closed').length;
  document.getElementById('stats').innerHTML = `open <b>${openN}</b> · closed <b>${issues.length - openN}</b>`;
  document.getElementById('void').style.display = issues.length ? 'none' : 'block';
  if (!issues.length) return;

  let ci = 0, cardSeq = 0;
  for (const col of COLS) {
    const items = issues.filter(i => columnOf(i) === col.key && matches(i, q)).sort((a, b) => a.id - b.id);
    if (col.key === 'none' && !items.length) continue;
    const sec = document.createElement('section');
    sec.className = 'col ' + col.cls;
    sec.style.animationDelay = (ci++ * 55) + 'ms';
    sec.innerHTML = `<div class="col-head"><span class="dot"></span><h2>${col.name}</h2><span class="n">${items.length}</span></div>`;
    if (!items.length) sec.insertAdjacentHTML('beforeend', '<div class="empty-col">—</div>');
    for (const it of items) {
      const card = document.createElement('article');
      card.className = 'card' + (it.state === 'closed' ? ' closed' : '');
      card.style.animationDelay = (Math.min(cardSeq++, 14) * 35) + 'ms';
      const extras = (it.labels||[]).filter(l => l !== col.key).map(l => `<span class="chip">${esc(l)}</span>`);
      if (it.type) extras.push(`<span class="chip">${esc(it.type)}</span>`);
      if (it.assignee) extras.push(`<span class="chip">@${esc(it.assignee)}</span>`);
      const nc = (it.comments||[]).length;
      if (nc) extras.push(`<span class="chip">✉ ${nc}</span>`);
      const blk = openBlockers(it);
      if (blk.length) extras.push(`<span class="chip blocked">⊘ ${blk.map(pad).join(' ')}</span>`);
      card.innerHTML = `<span class="cid">${pad(it.id)}</span><h3>${esc(it.title||'(제목 없음)')}</h3><div class="meta">${extras.join('')}</div>`;
      card.onclick = () => show(it);
      sec.appendChild(card);
    }
    board.appendChild(sec);
  }
}

function show(it){
  const col = COLS.find(c => c.key === columnOf(it));
  document.getElementById('panel').style.setProperty('--panel-accent', `var(--${col.cls})`);
  document.getElementById('p-id').textContent = pad(it.id);
  document.getElementById('p-title').textContent = it.title || '(제목 없음)';
  const facts = [
    ['state', it.state], ['labels', (it.labels||[]).join(', ') || '—'],
    ['assignee', it.assignee || '—'], ['dates', [it.created, it.updated].filter(Boolean).join(' → ') || '—'],
  ];
  if (it.type) facts.push(['type', it.type]);
  if (it.parent != null) facts.push(['parent', pad(it.parent)]);
  if ((it.blockedBy||[]).length) facts.push(['blocked by', it.blockedBy.map(pad).join(', ')]);
  document.getElementById('p-facts').innerHTML = facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  document.getElementById('p-body').innerHTML = md(it.body) || '<p style="color:var(--ink-soft)">본문 없음</p>';
  const cs = it.comments || [];
  document.getElementById('p-comments').innerHTML = cs.length
    ? cs.map(c => `<div class="comment"><div class="who">${esc(c.author||'?')} · ${esc(c.date||'')}</div><div class="body-md">${md(c.body)}</div></div>`).join('')
    : '';
  document.getElementById('overlay').classList.add('on');
}

document.getElementById('overlay').onclick = e => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('on'); };
document.getElementById('close').onclick = () => document.getElementById('overlay').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('overlay').classList.remove('on'); });
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
